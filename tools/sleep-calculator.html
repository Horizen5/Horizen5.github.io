<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>睡眠时间计算器</title>
    <style>

        /* 移动端触摸优化：消除300ms延迟+点击反馈 */
        a, button, [role=button], input[type=submit], input[type=button], [onclick] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(0,0,0,0.12);
            cursor: pointer;
        }
        :root {
            --bg-start: #0b0d2e;
            --bg-mid: #111844;
            --bg-end: #0d1028;
            --card-bg: rgba(22, 25, 55, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0e6ff;
            --text-secondary: #b8c4e8;
            --text-muted: #7b8db5;
            --gold: #f5b866;
            --gold-light: #ffd08a;
            --accent-6h: #7eb8da;
            --accent-8h: #b39ddb;
            --accent-active: #ffb74d;
            --thumb-color: #ffb74d;
            --track-color: rgba(255, 255, 255, 0.15);
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: linear-gradient(180deg, #080d24 0%, #111a40 35%, #141f4a 65%, #0e152e 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        html {
            background: #080d24;
        }

        /* ===== 星星背景 ===== */
        .stars-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute; border-radius: 50%;
            background: #fff;
            animation: twinkle var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.8); }
            25% { opacity: var(--peak-opacity); transform: scale(1.3); }
            50% { opacity: 0.25; transform: scale(0.9); }
            75% { opacity: var(--peak-opacity); transform: scale(1.15); }
        }
        @keyframes floatUp {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-6px); opacity: 1; }
        }
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        @keyframes wakeGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 183, 77, 0.3), 0 0 50px rgba(255, 183, 77, 0.1); }
            50% { box-shadow: 0 0 35px rgba(255, 183, 77, 0.55), 0 0 70px rgba(255, 183, 77, 0.25); }
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 主容器 ===== */
        .main-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid var(--card-border);
            padding: 28px 24px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            animation: slideInUp 0.6s ease-out;
        }

        /* ===== 当前时间 ===== */
        .current-time-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .now-label {
            font-size: 13px; color: var(--text-muted);
            letter-spacing: 2px; text-transform: uppercase;
            margin-bottom: 8px; font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .now-label .moon-icon {
            font-size: 16px;
            animation: floatUp 4s ease-in-out infinite;
            display: inline-block;
        }
        .current-time-display {
            font-size: 52px; font-weight: 300;
            color: var(--text-primary); letter-spacing: -1px;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }
        .current-time-display .time-colon {
            animation: gentlePulse 2s ease-in-out infinite;
            display: inline-block;
        }
        .current-time-display .ampm {
            font-size: 18px; font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
        }
        .current-date-display {
            font-size: 14px; color: var(--text-muted);
            margin-top: 6px; font-weight: 400;
        }

        /* ===== 分隔线 ===== */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 20px 0; border-radius: 1px;
        }

        /* ===== 快速选择 ===== */
        .quick-select-section { margin-bottom: 24px; }
        .section-label {
            font-size: 12px; color: var(--text-muted);
            letter-spacing: 2px; text-align: center;
            margin-bottom: 14px; font-weight: 500;
        }
        .quick-cards {
            display: flex; gap: 12px;
        }
        .quick-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .quick-card:active {
            transform: scale(0.96);
            transition: transform 0.15s ease-out;
        }
        .quick-card.card-6h { border-color: rgba(126, 184, 218, 0.3); }
        .quick-card.card-6h.active {
            border-color: var(--accent-6h);
            background: rgba(126, 184, 218, 0.14);
            box-shadow: 0 0 24px rgba(126, 184, 218, 0.2);
        }
        .quick-card.card-8h { border-color: rgba(179, 157, 219, 0.3); }
        .quick-card.card-8h.active {
            border-color: var(--accent-8h);
            background: rgba(179, 157, 219, 0.14);
            box-shadow: 0 0 24px rgba(179, 157, 219, 0.2);
        }
        .quick-card .card-hours {
            font-size: 22px; font-weight: 600;
            color: var(--text-primary); letter-spacing: -0.5px;
        }
        .quick-card.card-6h .card-hours { color: var(--accent-6h); }
        .quick-card.card-8h .card-hours { color: var(--accent-8h); }
        .quick-card .card-wake-time {
            font-size: 14px; color: var(--text-secondary);
            margin-top: 4px; font-weight: 500; letter-spacing: 0.3px;
        }
        .quick-card .card-tag {
            font-size: 10px; color: var(--text-muted);
            margin-top: 2px; letter-spacing: 0.5px;
        }
        .quick-card .check-dot {
            position: absolute; top: 8px; right: 8px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-active);
            opacity: 0; transform: scale(0);
            transition: all 0.25s ease-out;
        }
        .quick-card.active .check-dot {
            opacity: 1; transform: scale(1);
        }

        /* ===== 自定义滑块 ===== */
        .custom-slider-section { margin-bottom: 24px; }
        .slider-header {
            display: flex; justify-content: space-between;
            align-items: baseline; margin-bottom: 16px;
        }
        .slider-label {
            font-size: 12px; color: var(--text-muted);
            letter-spacing: 2px; font-weight: 500;
        }
        .slider-value-display {
            font-size: 28px; font-weight: 600;
            color: var(--text-primary); letter-spacing: -0.5px;
            transition: all 0.2s ease;
        }
        .slider-value-display .unit {
            font-size: 15px; font-weight: 400;
            color: var(--text-secondary); margin-left: 2px;
        }

        .range-wrapper {
            position: relative; width: 100%; padding: 8px 0 4px;
        }
        .range-ticks {
            position: relative; width: 100%; height: 20px;
            margin-bottom: 4px; pointer-events: none;
        }
        .range-tick {
            position: absolute; top: 0;
            transform: translateX(-50%);
            font-size: 10px; color: var(--text-muted);
            font-weight: 500; letter-spacing: 0.3px;
        }
        .range-tick.tick-6h { left: 45.45%; color: var(--accent-6h); font-weight: 600; }
        .range-tick.tick-8h { left: 63.64%; color: var(--accent-8h); font-weight: 600; }

        .tick-dot {
            position: absolute; top: 14px;
            width: 4px; height: 4px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-50%); pointer-events: none;
        }
        .tick-dot.dot-6h { left: 45.45%; background: var(--accent-6h); width: 5px; height: 5px; }
        .tick-dot.dot-8h { left: 63.64%; background: var(--accent-8h); width: 5px; height: 5px; }

        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 44px;
            background: transparent; cursor: pointer;
            outline: none; position: relative; z-index: 2;
            margin: 0; padding: 0;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            -webkit-appearance: none; height: 8px;
            border-radius: 12px; background: var(--track-color);
            border: none;
        }
        .range-track-bg {
            position: absolute; bottom: 18px; left: 0;
            width: 100%; height: 8px; border-radius: 12px;
            background: var(--track-color);
            pointer-events: none; z-index: 0;
        }
        .range-track-fill {
            position: absolute; bottom: 18px; left: 0;
            height: 8px; border-radius: 12px;
            background: linear-gradient(90deg, #5b9ecf, #8e7cc4, #f0a840);
            pointer-events: none; z-index: 0;
            transition: width 0.15s ease-out;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 34px; height: 34px; border-radius: 50%;
            background: #fff; border: 3px solid var(--thumb-color);
            cursor: pointer; margin-top: -13px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), 0 0 0 6px rgba(255, 183, 77, 0.18);
            transition: all 0.2s ease;
            position: relative; z-index: 3;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.12);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), 0 0 0 10px rgba(255, 183, 77, 0.28);
            border-color: #ff9f2e;
        }
        input[type="range"]::-moz-range-thumb {
            width: 34px; height: 34px; border-radius: 50%;
            background: #fff; border: 3px solid var(--thumb-color);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), 0 0 0 6px rgba(255, 183, 77, 0.18);
        }
        input[type="range"]::-moz-range-track {
            height: 8px; border-radius: 12px;
            background: var(--track-color); border: none;
        }

        /* ===== 醒来时间 ===== */
        .wake-time-section {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: wakeGlow 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        .wake-label {
            font-size: 12px; color: var(--text-muted);
            letter-spacing: 2px; font-weight: 500;
            margin-bottom: 6px;
            display: flex; align-items: center;
            justify-content: center; gap: 6px;
        }
        .wake-label .icon-sun {
            font-size: 16px;
            animation: floatUp 3s ease-in-out infinite;
            display: inline-block;
        }
        .wake-time-display {
            font-size: 44px; font-weight: 300;
            color: var(--gold); letter-spacing: -1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }
        .wake-date-tag {
            display: inline-block;
            font-size: 12px; font-weight: 500;
            color: #ffcc80;
            background: rgba(255, 183, 77, 0.15);
            border-radius: 10px;
            padding: 3px 10px; margin-top: 4px;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }
        .wake-sub-info {
            font-size: 12px; color: var(--text-muted);
            margin-top: 8px; letter-spacing: 0.5px;
        }

        /* ===== 响应式：手机小屏 (<=360px) ===== */
        @media screen and (max-width: 360px) {
            .current-time-display { font-size: 42px; }
            .current-time-display .ampm { font-size: 15px; }
            .wake-time-display { font-size: 36px; }
            .slider-value-display { font-size: 24px; }
            .quick-card .card-hours { font-size: 19px; }
            .quick-card .card-wake-time { font-size: 12px; }
            .quick-card { padding: 12px 8px; }
            .main-container { padding: 20px 16px 20px; border-radius: 24px; }
            input[type="range"]::-webkit-slider-thumb { width: 30px; height: 30px; margin-top: -11px; }
            .section-label, .slider-label, .wake-label { font-size: 11px; }
            .divider { margin: 14px 0; }
            .current-time-section { margin-bottom: 18px; }
            .quick-select-section { margin-bottom: 18px; }
            .custom-slider-section { margin-bottom: 18px; }
        }

        /* ===== 响应式：大手机/手机横屏 (481px ~ 768px) ===== */
        @media screen and (min-width: 481px) and (max-width: 768px) {
            body { padding: 24px; }
            .main-container { max-width: 480px; padding: 32px 28px 28px; }
            .current-time-display { font-size: 60px; }
            .current-time-display .ampm { font-size: 20px; }
            .wake-time-display { font-size: 50px; }
            .quick-card { padding: 18px 14px; }
            .quick-card .card-hours { font-size: 24px; }
            .quick-card .card-wake-time { font-size: 15px; }
            .slider-value-display { font-size: 32px; }
            input[type="range"]::-webkit-slider-thumb { width: 38px; height: 38px; margin-top: -15px; }
            input[type="range"]::-moz-range-thumb { width: 38px; height: 38px; }
            .range-tick { font-size: 11px; }
            .wake-time-section { padding: 22px 20px; }
        }

        /* ===== 响应式：平板竖屏 (769px ~ 1024px) ===== */
        @media screen and (min-width: 769px) and (max-width: 1024px) {
            body { padding: 32px; }
            .main-container { max-width: 520px; padding: 36px 32px 32px; border-radius: 32px; }
            .current-time-display { font-size: 68px; }
            .current-time-display .ampm { font-size: 22px; }
            .current-date-display { font-size: 16px; }
            .now-label { font-size: 14px; }
            .wake-time-display { font-size: 56px; }
            .section-label, .slider-label, .wake-label { font-size: 13px; }
            .quick-card { padding: 20px 16px; border-radius: 18px; }
            .quick-card .card-hours { font-size: 26px; }
            .quick-card .card-wake-time { font-size: 15px; }
            .quick-card .card-tag { font-size: 11px; }
            .slider-value-display { font-size: 36px; }
            .slider-value-display .unit { font-size: 17px; }
            input[type="range"]::-webkit-slider-thumb { width: 42px; height: 42px; margin-top: -17px; }
            input[type="range"]::-moz-range-thumb { width: 42px; height: 42px; }
            input[type="range"]::-webkit-slider-runnable-track { height: 10px; }
            .range-track-bg, .range-track-fill { height: 10px; bottom: 17px; }
            .range-tick { font-size: 12px; }
            .wake-time-section { padding: 24px 22px; border-radius: 22px; }
            .wake-date-tag { font-size: 13px; padding: 4px 12px; }
            .wake-sub-info { font-size: 13px; }
            .divider { margin: 24px 0; }
            .current-time-section { margin-bottom: 28px; }
            .quick-select-section { margin-bottom: 28px; }
            .custom-slider-section { margin-bottom: 28px; }
        }

        /* ===== 响应式：平板横屏/小桌面 (1025px ~ 1280px) ===== */
        @media screen and (min-width: 1025px) and (max-width: 1280px) {
            .main-container { max-width: 540px; padding: 40px 36px 36px; }
            .current-time-display { font-size: 72px; }
            .wake-time-display { font-size: 60px; }
            .quick-card .card-hours { font-size: 28px; }
        }

        /* ===== 响应式：大桌面 (>=1281px) ===== */
        @media screen and (min-width: 1281px) {
            .main-container { max-width: 560px; padding: 44px 40px 40px; }
            .current-time-display { font-size: 76px; }
            .wake-time-display { font-size: 64px; }
            .quick-card .card-hours { font-size: 30px; }
        }

        /* ===== 响应式：横屏低高度 ===== */
        @media screen and (orientation: landscape) and (max-height: 500px) {
            body { align-items: flex-start; padding: 12px 20px; }
            .main-container { max-width: 600px; padding: 16px 24px; border-radius: 20px; }
            .current-time-section { margin-bottom: 10px; }
            .current-time-display { font-size: 36px; }
            .current-time-display .ampm { font-size: 14px; }
            .now-label { font-size: 11px; margin-bottom: 4px; }
            .current-date-display { font-size: 12px; margin-top: 2px; }
            .divider { margin: 8px 0; }
            .quick-select-section { margin-bottom: 10px; }
            .section-label { font-size: 10px; margin-bottom: 8px; }
            .quick-cards { gap: 8px; }
            .quick-card { padding: 8px 10px; border-radius: 12px; }
            .quick-card .card-hours { font-size: 16px; }
            .quick-card .card-wake-time { font-size: 11px; }
            .custom-slider-section { margin-bottom: 10px; }
            .slider-header { margin-bottom: 10px; }
            .slider-value-display { font-size: 20px; }
            .wake-time-display { font-size: 30px; }
            .wake-time-section { padding: 10px 14px; border-radius: 16px; }
            .wake-label { font-size: 10px; margin-bottom: 2px; }
            .wake-date-tag { font-size: 10px; }
            .wake-sub-info { font-size: 10px; margin-top: 4px; }
            input[type="range"] { height: 32px; }
            input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -9px; }
            input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; }
        }

        /* ===== 高分辨率屏幕 ===== */
        @media screen and (-webkit-min-device-pixel-ratio: 2), screen and (min-resolution: 192dpi) {
            .main-container { border: 0.5px solid var(--card-border); }
            .divider { height: 0.5px; }
        }
    </style>
</head>
<body>

    <div class="stars-container" id="starsContainer"></div>

    <div class="main-container">
        <!-- 当前时间 -->
        <div class="current-time-section">
            <div class="now-label">
                <span class="moon-icon">&#127769;</span> 现在时间
            </div>
            <div class="current-time-display" id="currentTime">--:--</div>
            <div class="current-date-display" id="currentDate">----年--月--日 周-</div>
        </div>

        <div class="divider"></div>

        <!-- 快速选择 -->
        <div class="quick-select-section">
            <div class="section-label">&#9889; 快速选择睡眠时长</div>
            <div class="quick-cards">
                <button class="quick-card card-6h" id="card6h" onclick="selectPreset(6)">
                    <span class="check-dot"></span>
                    <span class="card-hours">6 小时</span>
                    <span class="card-wake-time" id="card6hWake">--:--</span>
                    <span class="card-tag" id="card6hTag"></span>
                </button>
                <button class="quick-card card-8h active" id="card8h" onclick="selectPreset(8)">
                    <span class="check-dot"></span>
                    <span class="card-hours">8 小时</span>
                    <span class="card-wake-time" id="card8hWake">--:--</span>
                    <span class="card-tag" id="card8hTag"></span>
                </button>
            </div>
        </div>

        <!-- 自定义滑块 -->
        <div class="custom-slider-section">
            <div class="slider-header">
                <span class="slider-label">&#127925; 自定义时长</span>
                <span class="slider-value-display" id="sliderValueDisplay">
                    <span id="sliderHours">8</span><span class="unit">小时</span>
                </span>
            </div>
            <div class="range-wrapper">
                <div class="range-ticks">
                    <span class="range-tick" style="left:0%;">1h</span>
                    <span class="range-tick tick-6h">6h</span>
                    <span class="range-tick tick-8h">8h</span>
                    <span class="range-tick" style="left:100%;">12h</span>
                </div>
                <div class="range-track-bg"></div>
                <div class="range-track-fill" id="rangeTrackFill"></div>
                <div class="tick-dot dot-6h"></div>
                <div class="tick-dot dot-8h"></div>
                <input type="range" id="sleepSlider" min="1" max="12" step="0.5" value="8" oninput="onSliderInput()" onchange="onSliderChange()">
            </div>
        </div>

        <!-- 醒来时间 -->
        <div class="wake-time-section" id="wakeSection">
            <div class="wake-label">
                <span class="icon-sun">&#127749;</span> 预计醒来时间
            </div>
            <div class="wake-time-display" id="wakeTimeDisplay">--:--</div>
            <span class="wake-date-tag" id="wakeDateTag">今天</span>
            <div class="wake-sub-info" id="wakeSubInfo">睡眠 8 小时</div>
        </div>
    </div>

    <script>
        (function() {
            const currentTimeEl = document.getElementById('currentTime');
            const currentDateEl = document.getElementById('currentDate');
            const sleepSlider = document.getElementById('sleepSlider');
            const sliderHoursEl = document.getElementById('sliderHours');
            const sliderValueDisplay = document.getElementById('sliderValueDisplay');
            const wakeTimeDisplay = document.getElementById('wakeTimeDisplay');
            const wakeDateTag = document.getElementById('wakeDateTag');
            const wakeSubInfo = document.getElementById('wakeSubInfo');
            const rangeTrackFill = document.getElementById('rangeTrackFill');
            const card6h = document.getElementById('card6h');
            const card8h = document.getElementById('card8h');
            const card6hWake = document.getElementById('card6hWake');
            const card8hWake = document.getElementById('card8hWake');
            const card6hTag = document.getElementById('card6hTag');
            const card8hTag = document.getElementById('card8hTag');
            const wakeSection = document.getElementById('wakeSection');
            const starsContainer = document.getElementById('starsContainer');

            function createStars() {
                const count = 45;
                const frag = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    const size = Math.random() * 2.5 + 1;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.setProperty('--dur', (Math.random() * 5 + 3) + 's');
                    star.style.setProperty('--delay', (Math.random() * 8) + 's');
                    star.style.setProperty('--peak-opacity', (Math.random() * 0.6 + 0.4));
                    frag.appendChild(star);
                }
                starsContainer.appendChild(frag);
            }
            createStars();

            function formatTime(date) {
                let hours = date.getHours();
                const minutes = date.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                if (hours === 0) hours = 12;
                const minStr = minutes.toString().padStart(2, '0');
                return { timeStr: hours + ':' + minStr, ampm, full: hours + ':' + minStr + ' ' + ampm };
            }

            function formatDate(date) {
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日 周' + weekdays[date.getDay()];
            }

            function isDifferentDay(d1, d2) { return d1.toDateString() !== d2.toDateString(); }
            function getSleepHours() { return parseFloat(sleepSlider.value); }

            function formatSleepHours(hours) {
                return hours === Math.floor(hours) ? Math.floor(hours) + ' 小时' : Math.floor(hours) + '小时30分';
            }

            function calcWakeTime(sleepHours) {
                return new Date(Date.now() + sleepHours * 3600000);
            }

            function updateTrackFill() {
                const min = parseFloat(sleepSlider.min);
                const max = parseFloat(sleepSlider.max);
                const val = parseFloat(sleepSlider.value);
                rangeTrackFill.style.width = ((val - min) / (max - min)) * 100 + '%';
            }

            function updateAll(triggeredBySlider) {
                const now = new Date();
                const currentFormatted = formatTime(now);
                currentTimeEl.innerHTML = currentFormatted.timeStr +
                    '<span class="time-colon">:</span>' +
                    currentFormatted.timeStr.split(':')[1] +
                    ' <span class="ampm">' + currentFormatted.ampm + '</span>';
                currentDateEl.textContent = formatDate(now);

                const sleepHours = getSleepHours();
                sliderHoursEl.textContent = sleepHours === Math.floor(sleepHours) ? Math.floor(sleepHours) : sleepHours.toFixed(1);
                updateTrackFill();

                const wakeTime = calcWakeTime(sleepHours);
                const wakeFormatted = formatTime(wakeTime);
                wakeTimeDisplay.textContent = wakeFormatted.full;

                const isTomorrow = isDifferentDay(now, wakeTime);
                wakeDateTag.textContent = isTomorrow ? '明天' : '今天';
                wakeDateTag.style.background = isTomorrow ? 'rgba(255,183,77,0.2)' : 'rgba(255,255,255,0.08)';
                wakeDateTag.style.color = isTomorrow ? '#ffcc80' : '#b8c4e8';
                wakeSubInfo.textContent = '睡眠 ' + formatSleepHours(sleepHours);

                const wake6h = calcWakeTime(6);
                const w6 = formatTime(wake6h);
                card6hWake.textContent = w6.full;
                card6hTag.textContent = isDifferentDay(now, wake6h) ? '明天醒来' : '今天醒来';

                const wake8h = calcWakeTime(8);
                const w8 = formatTime(wake8h);
                card8hWake.textContent = w8.full;
                card8hTag.textContent = isDifferentDay(now, wake8h) ? '明天醒来' : '今天醒来';

                const tolerance = 0.15;
                card6h.classList.toggle('active', Math.abs(sleepHours - 6) <= tolerance);
                card8h.classList.toggle('active', Math.abs(sleepHours - 8) <= tolerance);
                if (Math.abs(sleepHours - 6) > tolerance && Math.abs(sleepHours - 8) > tolerance) {
                    card6h.classList.remove('active');
                    card8h.classList.remove('active');
                }

                if (triggeredBySlider) {
                    wakeSection.style.transform = 'scale(1.02)';
                    setTimeout(() => { wakeSection.style.transform = 'scale(1)'; }, 180);
                }
            }

            window.onSliderInput = function() { updateAll(true); };
            window.onSliderChange = function() { updateAll(true); };
            window.selectPreset = function(hours) {
                sleepSlider.value = hours;
                updateAll(true);
                if (navigator.vibrate) navigator.vibrate(12);
            };

            updateTrackFill();
            updateAll();
            setInterval(() => updateAll(false), 20000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) updateAll(false); });
            window.addEventListener('orientationchange', () => { setTimeout(() => { updateTrackFill(); updateAll(false); }, 300); });
            document.addEventListener('gesturestart', function(e) {
                if (e.target.tagName === 'INPUT' && e.target.type === 'range') e.preventDefault();
            }, { passive: false });
        })();
    </script>
</body>
</html>
