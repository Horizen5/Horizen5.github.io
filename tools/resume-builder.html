<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历制作工具 - 个人简历自助生成器</title>
<style>
/* ========== CSS Variables ========== */
:root {
  --bg: #f0f2f5;
  --bg2: #ffffff;
  --ink: #333333;
  --muted: #666666;
  --rule: #e0e0e0;
  --accent: #4e7282;
  --accent2: #5e8597;
  --accent-dark: #405e6c;
  --accent-light: #e8eef1;
  --danger: #d95555;
  --success: #4a9d5f;
  --resume-bg: #ffffff;
  --resume-ink: #414141;
  --resume-muted: #888888;
  --resume-accent: #4e7282;
  --resume-section-bg: #4e7282;
  --resume-header-dark: #405e6c;
  --resume-leader: #b0b0b0;
}

/* ========== Reset ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
}

/* ========== Toolbar ========== */
.toolbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  min-height: 52px;
  background: var(--accent-dark);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 8px 16px;
  z-index: 1000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.toolbar-left { display: flex; align-items: center; gap: 10px; flex-shrink: 1; min-width: 0; }
.toolbar-title { color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
.toolbar-subtitle { color: rgba(255,255,255,0.6); font-size: 11px; display: none; }
.toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex-shrink: 1; }
.btn {
  padding: 10px 18px; min-height: 40px; border: none; border-radius: 6px;
  font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500;
  transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; touch-action: manipulation; -webkit-tap-highlight-color: rgba(0,0,0,0.12);
}
.btn-primary { background: #fff; color: var(--accent-dark); }
.btn-primary:hover { background: #f0f0f0; transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
.btn-secondary:hover { background: rgba(255,255,255,0.25); }
.btn-export { background: #fff; color: var(--accent-dark); font-weight: 600; }
.btn-export:hover { background: #f0f0f0; transform: translateY(-1px); }

/* ========== Main Layout ========== */
.main-container { display: flex; gap: 0; margin-top: 52px; min-height: calc(100vh - 52px); }

/* ========== Editor Panel ========== */
.editor-panel {
  width: 460px; min-width: 460px; background: var(--bg2);
  border-left: 1px solid var(--rule); overflow-y: auto;
  height: calc(100vh - 52px); position: sticky; top: 52px; order: 2;
}
.editor-content { padding: 20px 24px 60px; }
.editor-section { margin-bottom: 24px; }
.editor-section-title {
  font-size: 15px; font-weight: 600; color: var(--accent);
  padding-bottom: 8px; border-bottom: 2px solid var(--accent-light);
  margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.editor-section-title::before {
  content: ''; width: 4px; height: 16px; background: var(--accent); border-radius: 2px;
}

.field-group { margin-bottom: 12px; }
.field-row { display: flex; gap: 10px; margin-bottom: 10px; }
.field-row > div { flex: 1; }
.field-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.field-input, .field-textarea, .field-select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--rule);
  border-radius: 5px; font-size: 13px; font-family: inherit;
  color: var(--ink); background: #fafafa; transition: all 0.2s;
}
.field-input:focus, .field-textarea:focus, .field-select:focus {
  outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(61,107,125,0.1);
}
.field-textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

.entry-card { background: #f8f9fa; border: 1px solid var(--rule); border-radius: 8px; padding: 14px; margin-bottom: 12px; position: relative; }
.entry-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.entry-card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.entry-remove {
  background: none; border: none; color: var(--danger); cursor: pointer;
  font-size: 18px; padding: 8px 10px; min-width: 36px; min-height: 36px;
  border-radius: 6px; transition: background 0.2s; touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(217,85,85,0.2);
}
.entry-remove:hover { background: rgba(217,85,85,0.1); }

.btn-add {
  width: 100%; padding: 12px; min-height: 44px; border: 2px dashed var(--rule);
  background: transparent; border-radius: 8px; color: var(--muted); cursor: pointer;
  font-size: 13px; font-family: inherit; transition: all 0.2s; touch-action: manipulation;
}
.btn-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

.bullet-list { margin-bottom: 8px; }
.bullet-item { display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-start; }
.bullet-item .bullet-dot { color: var(--accent); margin-top: 8px; font-size: 10px; flex-shrink: 0; }
.bullet-item .field-textarea { min-height: 40px; font-size: 12px; }
.bullet-remove {
  background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px;
  padding: 8px 8px; min-width: 32px; min-height: 36px; flex-shrink: 0;
  touch-action: manipulation; -webkit-tap-highlight-color: rgba(217,85,85,0.2);
}
.bullet-remove:hover { background: rgba(217,85,85,0.1); border-radius: 4px; }

.photo-upload-area { display: flex; gap: 12px; align-items: center; }
.photo-preview {
  width: 80px; height: 100px; border: 2px solid var(--rule); border-radius: 6px;
  overflow: hidden; background: #f0f0f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.photo-preview img { width: 100%; height: 100%; object-fit: cover; }
.photo-preview .placeholder { color: var(--muted); font-size: 11px; text-align: center; }
.photo-actions { flex: 1; }
.photo-actions .btn-small {
  padding: 10px 14px; min-height: 40px; font-size: 12px; border: 1px solid var(--rule);
  border-radius: 5px; background: #fff; cursor: pointer; font-family: inherit;
  color: var(--muted); margin-bottom: 6px; display: block; touch-action: manipulation;
}
.photo-actions .btn-small:hover { border-color: var(--accent); color: var(--accent); }

.color-options { display: flex; gap: 8px; margin-top: 4px; }
.color-swatch {
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: all 0.2s; touch-action: manipulation;
}
.color-swatch.active { border-color: var(--ink); transform: scale(1.1); }
.color-swatch:hover { transform: scale(1.15); }

/* ========== Preview Panel ========== */
.preview-panel {
  flex: 1; padding: 30px; overflow-y: auto; height: calc(100vh - 52px);
  display: flex; justify-content: center; background: var(--bg); order: 1;
}
.resume-pages { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; }

/* ========== Resume Page (A4) ========== */
.resume-page {
  width: 210mm; min-height: 297mm; background: var(--resume-bg);
  box-shadow: 0 4px 24px rgba(0,0,0,0.12); position: relative;
  font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  color: var(--resume-ink); overflow: hidden;
}
.resume-page-inner { box-sizing: border-box; height: 100%; position: relative; }

/* ========== Resume Header ========== */
.resume-header {
  display: flex; align-items: flex-start; padding: 18px 28px 6px 20px; gap: 10px;
}
.resume-header-left { flex-shrink: 0; }
.resume-title {
  font-size: 36px; font-weight: 700; color: var(--resume-accent); letter-spacing: 2px; line-height: 1.1;
}
.resume-title-divider {
  display: inline-block; width: 1.5px; height: 52px; background: var(--resume-accent);
  margin: 0 8px; vertical-align: middle;
}
.resume-header-center { flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; padding-top: 4px; }
.resume-tagline { font-size: 10pt; color: var(--resume-accent); white-space: nowrap; line-height: 1.3; }
.resume-subtitle-en {
  font-size: 18px; color: var(--resume-accent); letter-spacing: 1px; margin-top: 2px; line-height: 1.2;
}
.resume-header-icons { display: flex; gap: 8px; flex-shrink: 0; padding-top: 4px; margin-left: auto; }
.resume-header-icon {
  width: 32px; height: 32px; border-radius: 50%; background: #808080;
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.resume-header-icon svg { width: 15px; height: 15px; fill: #fff; }

/* ========== Two-Layer Slanted Bar ========== */
/* DOCX WPS7: 左竖右斜(向外); WPS8: 左斜(向外)右竖 — 对称斜切 */
.header-bar-wrap { margin: 2px 28px 0 20px; }
.header-slanted-bar {
  height: 6px; background: var(--resume-accent);
  /* 左竖右斜(向外): 左边垂直, 右边上窄下宽 */
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 100%, 0 100%);
}
.header-slanted-bar.thin {
  height: 2px; margin-top: 3px;
  /* DOCX path: M 0,0 L 3308894,0 L 3308894,190500 L 105319,190500 */
  /* 左边上宽下窄(0%→3.2%), 右边垂直 */
  clip-path: polygon(0 0, 100% 0, 100% 100%, 18px 100%);
}

/* ========== Section Header (SVG — exact DOCX custGeom paths) ========== */
/* DOCX custGeom: 3 parallel slanted strips with white gaps (speed-line effect) */
/* Path data extracted from document.xml, viewBox="0 0 1406296 288031" */
/* Each section header area = banner + small dark triangle + horizontal line */
.resume-section { padding: 0; margin-bottom: 4px; display: flex; flex-wrap: wrap; align-items: center; }
.resume-section.no-header .resume-section-header { display: none; }
.resume-section-header {
  position: relative; display: inline-flex; align-items: center;
  width: 3.91cm; height: 0.8cm;
  margin: 8px 0 4px 20px; overflow: visible;
}
.section-header-shape {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
}
.section-header-content {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 6px;
  padding-left: 10px; color: #fff; height: 100%;
}
.section-header-icon { width: 14px; height: 14px; fill: #fff; flex-shrink: 0; }
.section-header-title { font-size: 12pt; font-weight: 700; color: #fff; letter-spacing: 1px; white-space: nowrap; }
/* DOCX Shape 2: line, fill=#4E7282, from banner right edge to page right margin */
.resume-section-line {
  flex: 1; height: 1px; background: var(--resume-accent);
  margin: 0 28px 4px 0; min-width: 20px;
}

/* ========== Basic Info ========== */
.resume-basic-info { padding: 4px 28px 0 20px; }
.basic-info-body { display: flex; gap: 16px; align-items: flex-start; }
.basic-info-grid {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr;
  gap: 3px 20px; font-size: 10pt; color: #414141;
}
.basic-info-item { display: flex; align-items: baseline; }
.basic-info-label { font-weight: 600; white-space: nowrap; color: #414141; }
.basic-info-value { color: #414141; }
.basic-info-photo {
  width: 82px; height: 110px; flex-shrink: 0; border: 1px solid #ddd;
  overflow: hidden; background: #f5f5f5; display: flex; align-items: center; justify-content: center;
}
.basic-info-photo img { width: 100%; height: 100%; object-fit: cover; }
.basic-info-photo .placeholder { color: var(--resume-muted); font-size: 9px; text-align: center; }

/* ========== Section Body ========== */
.resume-section-body { flex-basis: 100%; font-size: 10pt; line-height: 1.65; color: #414141; padding: 0 28px 0 20px; }

/* ========== Experience / Education Entry ========== */
.exp-entry { margin-bottom: 4px; }
.exp-header-line { display: flex; align-items: baseline; font-size: 10pt; margin-bottom: 2px; }
.exp-date { white-space: nowrap; flex-shrink: 0; color: #414141; }
.exp-leader {
  flex: 1; border-bottom: 1px dotted var(--resume-leader);
  margin: 0 6px; height: 0; position: relative; top: -3px; min-width: 20px;
}
.exp-org { white-space: nowrap; flex-shrink: 0; font-weight: 500; color: #414141; }
.exp-role { white-space: nowrap; flex-shrink: 0; color: #414141; }
.exp-bullets { list-style: none; padding-left: 0; margin-top: 2px; }
.exp-bullets li {
  position: relative; padding-left: 12px; margin-bottom: 0px; line-height: 1.55;
  text-align: justify; font-size: 10pt; color: #414141;
}
.exp-bullets li::before {
  content: '●'; position: absolute; left: 0; top: 0; font-size: 5px; color: var(--resume-accent);
}

/* Education details */
.edu-detail { font-size: 10pt; margin-bottom: 0px; color: #414141; }
.edu-detail-label { font-weight: 600; }

/* Skills (no bullets, plain text) */
.skills-list { list-style: none; padding-left: 0; }
.skills-list li {
  margin-bottom: 1px; line-height: 1.55; text-align: justify; font-size: 10pt; color: #414141;
}

/* Self-eval */
.self-eval-text { font-size: 10pt; line-height: 1.65; text-align: justify; color: #414141; }

/* ========== Print Styles ========== */
@media print {
  @page { size: A4; margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  html, body { background: #fff !important; height: auto !important; overflow: visible !important; }
  .toolbar, .editor-panel, #resumeSource, .btn-export, .mobile-toggle { display: none !important; }
  .main-container { display: block !important; margin: 0 !important; padding: 0 !important; }
  .preview-panel { display: block !important; padding: 0 !important; height: auto !important; overflow: visible !important; background: #fff !important; }
  .resume-pages { display: block !important; gap: 0 !important; width: auto !important; align-items: stretch !important; }
  .resume-page {
    width: 210mm !important; min-height: 297mm !important; max-height: 297mm !important;
    box-shadow: none !important; margin: 0 !important; padding: 0 !important;
    transform: none !important; transform-origin: top left !important;
    page-break-after: always !important; page-break-inside: avoid !important;
    overflow: hidden !important; box-sizing: border-box !important;
  }
  .resume-page:last-child { page-break-after: auto !important; }
  .resume-section, .exp-entry, .basic-info-item, .basic-info-photo { page-break-inside: avoid !important; }
  img { max-width: 100% !important; }
}

/* ========== Scrollbar ========== */
.editor-panel::-webkit-scrollbar { width: 6px; }
.editor-panel::-webkit-scrollbar-track { background: transparent; }
.editor-panel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
.editor-panel::-webkit-scrollbar-thumb:hover { background: #aaa; }
.preview-panel::-webkit-scrollbar { width: 6px; }
.preview-panel::-webkit-scrollbar-track { background: transparent; }
.preview-panel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

/* ========== Responsive ========== */
@media screen and (max-width: 1100px) {
  .resume-page { transform: scale(0.82); transform-origin: top center; }
}
@media screen and (max-width: 900px) {
  .main-container { flex-direction: column; }
  .editor-panel { width: 100%; min-width: 100%; height: auto; position: relative; top: 0; order: 1; border-left: none; border-bottom: 1px solid var(--rule); }
  .preview-panel { order: 2; height: auto; padding: 20px; }
  .resume-page { transform: none; width: 100%; max-width: 210mm; }
}
.mobile-toggle { display: none; }
@media screen and (max-width: 900px) {
  .mobile-toggle { display: inline-flex; }
  .editor-panel.collapsed { display: none; }
}
@media screen and (max-width: 600px) {
  .toolbar { padding: 6px 10px; gap: 4px; }
  .toolbar-left { gap: 6px; }
  .toolbar-title { font-size: 14px; }
  .toolbar-right { gap: 4px; }
  .btn { padding: 8px 12px; font-size: 12px; border-radius: 5px; }
  .btn-export { padding: 6px 10px; font-size: 12px; }
  .editor-content { padding: 14px 14px 50px; }
  .field-row { flex-direction: column; gap: 0; }
  .field-input, .field-textarea, .field-select { font-size: 14px; padding: 10px 12px; }
  .color-options { gap: 8px; }
  .color-swatch { width: 32px; height: 32px; }
}
@media screen and (max-width: 380px) {
  .toolbar-title { font-size: 13px; }
  .btn { padding: 5px 8px; font-size: 11px; }
}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn btn-secondary mobile-toggle" onclick="toggleEditor()">☰ 编辑</button>
    <span class="toolbar-title">简历制作工具</span>
    <span class="toolbar-subtitle">自助填写 · 实时预览 · 一键导出</span>
  </div>
  <div class="toolbar-right">
    <button class="btn btn-secondary" onclick="loadSample()">加载示例</button>
    <button class="btn btn-secondary" onclick="resetForm()">清空</button>
    <button class="btn btn-secondary" onclick="saveToLocal()">保存</button>
    <button class="btn btn-export" onclick="exportPDF()">🖨️ 打印 / 另存PDF</button>
  </div>
</div>

<div class="main-container">
  <!-- Editor Panel (右侧) -->
  <div class="editor-panel" id="editorPanel">
    <div class="editor-content">

      <!-- Page Settings -->
      <div class="editor-section">
        <div class="editor-section-title">页面设置</div>
        <div class="field-row">
          <div>
            <label class="field-label">页边距（边框）</label>
            <select class="field-select" id="pageMargin" onchange="changeMargin(this.value)">
              <option value="narrow">窄</option>
              <option value="normal" selected>正常</option>
              <option value="wide">宽</option>
            </select>
          </div>
        </div>
        <div class="field-group" style="font-size:12px;color:var(--muted);line-height:1.5;">
          内容超出一页时会自动换页，每页均为 A4 幅面（与 Word / WPS 排版一致）。
        </div>
      </div>

      <!-- Theme Color -->
      <div class="editor-section">
        <div class="editor-section-title">主题配色</div>
        <div class="color-options" id="colorOptions">
          <div class="color-swatch active" style="background:#4e7282" data-color="#4e7282" onclick="changeColor(this)"></div>
          <div class="color-swatch" style="background:#2c5f8a" data-color="#2c5f8a" onclick="changeColor(this)"></div>
          <div class="color-swatch" style="background:#8b4513" data-color="#8b4513" onclick="changeColor(this)"></div>
          <div class="color-swatch" style="background:#555555" data-color="#555555" onclick="changeColor(this)"></div>
          <div class="color-swatch" style="background:#7a3d5e" data-color="#7a3d5e" onclick="changeColor(this)"></div>
          <div class="color-swatch" style="background:#2d7d4e" data-color="#2d7d4e" onclick="changeColor(this)"></div>
        </div>
      </div>

      <!-- Header -->
      <div class="editor-section">
        <div class="editor-section-title">标题与标语</div>
        <div class="field-row">
          <div>
            <label class="field-label">主标题</label>
            <input class="field-input" id="hdr_title" value="个人简历" oninput="updatePreview()">
          </div>
          <div>
            <label class="field-label">英文副标题</label>
            <input class="field-input" id="hdr_subtitle" value="Personal resume" oninput="updatePreview()">
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">标语</label>
          <input class="field-input" id="hdr_tagline" value="细心从每一个小细节开始" oninput="updatePreview()">
        </div>
      </div>

      <!-- Photo -->
      <div class="editor-section">
        <div class="editor-section-title">证件照</div>
        <div class="photo-upload-area">
          <div class="photo-preview" id="photoPreview">
            <span class="placeholder">暂无照片</span>
          </div>
          <div class="photo-actions">
            <button class="btn-small" onclick="document.getElementById('photoFile').click()">上传照片</button>
            <button class="btn-small" onclick="removePhoto()">移除照片</button>
          </div>
          <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
        </div>
      </div>

      <!-- Basic Info -->
      <div class="editor-section">
        <div class="editor-section-title">基本信息</div>
        <div class="field-row">
          <div>
            <label class="field-label">姓名</label>
            <input class="field-input" id="bi_name" placeholder="如：张三" oninput="updatePreview()">
          </div>
          <div>
            <label class="field-label">出生年月</label>
            <input class="field-input" id="bi_birth" placeholder="如：1996.05" oninput="updatePreview()">
          </div>
        </div>
        <div class="field-row">
          <div>
            <label class="field-label">民族</label>
            <input class="field-input" id="bi_ethnicity" placeholder="如：汉" oninput="updatePreview()">
          </div>
          <div>
            <label class="field-label">身高</label>
            <input class="field-input" id="bi_height" placeholder="如：170cm" oninput="updatePreview()">
          </div>
        </div>
        <div class="field-row">
          <div>
            <label class="field-label">电话</label>
            <input class="field-input" id="bi_phone" placeholder="如：13800138000" oninput="updatePreview()">
          </div>
          <div>
            <label class="field-label">政治面貌</label>
            <input class="field-input" id="bi_political" placeholder="如：中共党员" oninput="updatePreview()">
          </div>
        </div>
        <div class="field-row">
          <div>
            <label class="field-label">邮箱</label>

  if (label.length === 2) {

  }
  return label + '：';
}

// Basic-info row: hide the whole row when the editor field is empty
function biRow(label, value) {

  return `<div class="basic-info-item"><span class="basic-info-label">${label}</span><span class="basic-info-value">${esc(v)}</span></div>`;
}

// ========== Pagination ==========

function getSectionItems(body) {
  if (body.children.length === 1) {
    const only = body.children[0];
    if (/^(UL|OL)$/.test(only.tagName)) return [only];
  }
  return Array.from(body.children);
}

function flattenUnits(inner) {
  const out = [];
  let secCounter = 0;
  Array.from(inner.children).forEach(block => {
    if (block.classList.contains('resume-section')) {
      const head = block.querySelector('.resume-section-header');
      const body = block.querySelector('.resume-section-body');
      if (!body || body.children.length === 0) {
        // Section with header only (like basic info header)
        out.push({ el: block, sec: null });
        return;
      }
      const sid = 's' + (secCounter++);
      getSectionItems(body).forEach(item => {
        const u = document.createElement('div');
        u.className = 'resume-section';
        u.dataset.sec = sid;
        if (head) u.appendChild(head.cloneNode(true));
        const line = document.createElement('div');
        line.className = 'resume-section-line';
        u.appendChild(line);
        const b = document.createElement('div');
        b.className = 'resume-section-body';
        b.appendChild(item.cloneNode(true));
        u.appendChild(b);
        out.push({ el: u, sec: sid });
      });
    } else {
      out.push({ el: block, sec: null });
    }
  });
  return out;
}

function createPage(wrap, margin) {
  const p = document.createElement('div');
  p.className = 'resume-page';
  const inner = document.createElement('div');
  inner.className = 'resume-page-inner';
  inner.style.padding = margin + 'px';
  p.appendChild(inner);
  wrap.appendChild(p);
  return inner;
}

function paginate(margin) {
  const M = MARGINS[margin] || MARGINS.normal;
  const pagesWrap = document.getElementById('resumePages');
  pagesWrap.innerHTML = '';

  const src = document.getElementById('resumeSource');
  src.innerHTML = `<div class="resume-page"><div class="resume-page-inner" style="padding:${M}px">${buildResumeContent()}</div></div>`;

  const srcInner = src.querySelector('.resume-page-inner');
  const units = flattenUnits(srcInner);

  const avail = A4_H_PX - 2 * M - 6;
  let curInner = createPage(pagesWrap, M);
  let used = 0;

  units.forEach(unit => {
    curInner.appendChild(unit.el);
    const h = unit.el.offsetHeight;
    if (used > 0 && used + h > avail) {
      curInner.removeChild(unit.el);
      curInner = createPage(pagesWrap, M);
      curInner.appendChild(unit.el);
      used = h;
    } else {
      used += h;
    }
  });

  // Hide duplicated section titles on the same page
  Array.from(pagesWrap.children).forEach(page => {
    const inner = page.querySelector('.resume-page-inner');
    const seen = new Set();
    Array.from(inner.children).forEach(u => {
      if (u.dataset && u.dataset.sec) {
        if (seen.has(u.dataset.sec)) {
          u.classList.add('no-header');
        } else {
          seen.add(u.dataset.sec);
        }
      }
    });
  });

  src.innerHTML = '';
}

// ========== Preview Rendering ==========
function updatePreview() {
  resumeData.header.title = document.getElementById('hdr_title').value;
  resumeData.header.subtitle = document.getElementById('hdr_subtitle').value;
  resumeData.header.tagline = document.getElementById('hdr_tagline').value;

  resumeData.basicInfo.name = document.getElementById('bi_name').value;
  resumeData.basicInfo.birth = document.getElementById('bi_birth').value;
  resumeData.basicInfo.ethnicity = document.getElementById('bi_ethnicity').value;
  resumeData.basicInfo.height = document.getElementById('bi_height').value;
  resumeData.basicInfo.phone = document.getElementById('bi_phone').value;
  resumeData.basicInfo.political = document.getElementById('bi_political').value;
  resumeData.basicInfo.email = document.getElementById('bi_email').value;
  resumeData.basicInfo.school = document.getElementById('bi_school').value;
  resumeData.basicInfo.address = document.getElementById('bi_address').value;
  resumeData.basicInfo.degree = document.getElementById('bi_degree').value;
  resumeData.selfEval = document.getElementById('selfEval').value;
  resumeData.margin = document.getElementById('pageMargin').value;

  document.documentElement.style.setProperty('--resume-accent', resumeData.themeColor);
  document.documentElement.style.setProperty('--resume-section-bg', resumeData.themeColor);

  paginate(resumeData.margin);
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

// ========== Add/Remove Functions ==========

function addEducation() {
  resumeData.education.push({ id: nextId(), date: '', school: '', major: '', detail1: '', detail2: '' });
  renderEducationList(); updatePreview();
}
function removeEducation(id) {
  resumeData.education = resumeData.education.filter(e => e.id !== id);
  renderEducationList(); updatePreview();
}

function addInternship() {
  resumeData.internships.push({ id: nextId(), date: '', org: '', role: '', bullets: [''] });
  renderInternshipList(); updatePreview();
}
function removeInternship(id) {
  resumeData.internships = resumeData.internships.filter(e => e.id !== id);
  renderInternshipList(); updatePreview();
}

function addProject() {
  resumeData.projects.push({ id: nextId(), date: '', org: '', role: '', bullets: [''] });
  renderProjectList(); updatePreview();
}
function removeProject(id) {
  resumeData.projects = resumeData.projects.filter(e => e.id !== id);
  renderProjectList(); updatePreview();
}

function addBullet(dataPath) {
  const arr = eval(dataPath);
  arr.push('');
  refreshEditors(); updatePreview();
}
function removeBullet(dataPath, index) {
  const arr = eval(dataPath);
  arr.splice(index, 1);
  refreshEditors(); updatePreview();
}

function addSkill() {
  resumeData.skills.push('');
  renderSkillsList(); updatePreview();
}
function removeSkill(index) {
  resumeData.skills.splice(index, 1);
  renderSkillsList(); updatePreview();
}

function refreshEditors() {
  renderEducationList();
  renderInternshipList();
  renderProjectList();
  renderSkillsList();
}

// ========== Photo ==========

function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    resumeData.photo = e.target.result;
    updatePhotoPreview(); updatePreview();
  };
  reader.readAsDataURL(file);
}
function updatePhotoPreview() {
  const preview = document.getElementById('photoPreview');
  if (resumeData.photo) {
    preview.innerHTML = `<img src="${resumeData.photo}" alt="photo">`;
  } else {
    preview.innerHTML = '<span class="placeholder">暂无照片</span>';
  }
}
function removePhoto() {
  resumeData.photo = null;
  document.getElementById('photoFile').value = '';
  updatePhotoPreview(); updatePreview();
}

// ========== Theme Color ==========

function changeColor(swatch) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  swatch.classList.add('active');
  resumeData.themeColor = swatch.dataset.color;
  document.documentElement.style.setProperty('--resume-accent', resumeData.themeColor);
  document.documentElement.style.setProperty('--resume-section-bg', resumeData.themeColor);
  updatePreview();
}

// ========== Margin ==========
function changeMargin(value) {
  resumeData.margin = value;
  updatePreview();
}

// ========== Sample / Reset / Save / Export ==========

function loadSample() {
  resumeData = JSON.parse(JSON.stringify(sampleData));
  entryIdCounter = resumeData.education.length + resumeData.internships.length + resumeData.projects.length + 10;
  syncFormFields(); refreshEditors(); updatePhotoPreview(); updatePreview();
}

function syncFormFields() {
  document.getElementById('hdr_title').value = resumeData.header.title;
  document.getElementById('hdr_subtitle').value = resumeData.header.subtitle;
  document.getElementById('hdr_tagline').value = resumeData.header.tagline;
  document.getElementById('bi_name').value = resumeData.basicInfo.name || '';
  document.getElementById('bi_birth').value = resumeData.basicInfo.birth || '';
  document.getElementById('bi_ethnicity').value = resumeData.basicInfo.ethnicity || '';
  document.getElementById('bi_height').value = resumeData.basicInfo.height || '';
  document.getElementById('bi_phone').value = resumeData.basicInfo.phone || '';
  document.getElementById('bi_political').value = resumeData.basicInfo.political || '';
  document.getElementById('bi_email').value = resumeData.basicInfo.email || '';
  document.getElementById('bi_school').value = resumeData.basicInfo.school || '';
  document.getElementById('bi_address').value = resumeData.basicInfo.address || '';
  document.getElementById('bi_degree').value = resumeData.basicInfo.degree || '';
  document.getElementById('selfEval').value = resumeData.selfEval || '';
  document.getElementById('pageMargin').value = resumeData.margin || 'normal';
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === resumeData.themeColor);
  });
  document.documentElement.style.setProperty('--resume-accent', resumeData.themeColor);
  document.documentElement.style.setProperty('--resume-section-bg', resumeData.themeColor);
}

function resetForm() {
  if (!confirm('确定要清空所有内容吗？')) return;
  resumeData = {
    themeColor: '#4e7282', margin: 'normal',
    header: { title: '个人简历', subtitle: 'Personal resume', tagline: '细心从每一个小细节开始' },
    photo: null,
    basicInfo: { name: '', birth: '', ethnicity: '', height: '', phone: '', political: '', email: '', school: '', address: '', degree: '' },
    education: [], internships: [], projects: [], skills: [], selfEval: ''
  };
  entryIdCounter = 0;
  syncFormFields(); refreshEditors(); updatePhotoPreview(); updatePreview();
}

function saveToLocal() {
  updatePreview();
  lsSet('resumeData', JSON.stringify(resumeData));
  showToast('已保存到浏览器本地存储');
}

function loadFromLocal() {
  const saved = lsGet('resumeData');
  if (saved) {
    try {
      resumeData = JSON.parse(saved);
      // Migrate old field names if needed
      if (resumeData.basicInfo.age && !resumeData.basicInfo.birth) {
        resumeData.basicInfo.birth = resumeData.basicInfo.age;
        delete resumeData.basicInfo.age;
      }
      if (resumeData.basicInfo.gender && !resumeData.basicInfo.height) {
        delete resumeData.basicInfo.gender;
      }
      if (resumeData.basicInfo.origin && !resumeData.basicInfo.address) {
        resumeData.basicInfo.address = resumeData.basicInfo.origin;
        delete resumeData.basicInfo.origin;
      }
      entryIdCounter = Math.max(
        ...resumeData.education.map(e => e.id || 0),
        ...resumeData.internships.map(e => e.id || 0),
        ...resumeData.projects.map(e => e.id || 0), 0
      ) + 1;
      syncFormFields(); refreshEditors(); updatePhotoPreview(); updatePreview();
      return true;
    } catch(e) { return false; }
  }
  return false;
}

// ========== PDF Export: use browser print for crisp A4 output ==========
function exportPDF() {
  updatePreview();
  const pages = document.querySelectorAll('.resume-page');
  if (!pages.length) {
    showToast('没有可导出的内容');
    return;
  }
  window.print();
}

function toggleEditor() {
  document.getElementById('editorPanel').classList.toggle('collapsed');
}

// ========== Toast ==========

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:6px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}

// ========== Init ==========

window.addEventListener('DOMContentLoaded', function() {
  if (!loadFromLocal()) {
    loadSample();
  }
  updatePreview();
});

let saveTimer = null;
document.addEventListener('input', function() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    updatePreview();
    lsSet('resumeData', JSON.stringify(resumeData));
  }, 1000);
});
</script>
