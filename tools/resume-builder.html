function renderBulletEditor(bullets, dataPath) {
  return `
    <div class="bullet-list">
      ${bullets.map((b, j) => `
        <div class="bullet-item">
          <span class="bullet-dot">●</span>
          <textarea class="field-textarea" oninput="${dataPath}[${j}]=this.value; updatePreview()">${b}</textarea>
          <button class="bullet-remove" onclick="removeBullet('${dataPath}', ${j})">×</button>
        </div>
      `).join('')}
    </div>
    <button class="btn-add" onclick="addBullet('${dataPath}')">+ 添加一条</button>
  `;
}

function renderSkillsList() {
  const container = document.getElementById('skillsList');
  container.innerHTML = resumeData.skills.map((s, i) => `

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== Add/Remove Functions ==========

function addEducation() {
  resumeData.education.push({
    id: nextId(),
    date: '', school: '', major: '', detail1: '', detail2: ''
  });
  renderEducationList();
  updatePreview();
}
function removeEducation(id) {
  resumeData.education = resumeData.education.filter(e => e.id !== id);
  renderEducationList();
  updatePreview();
}

function addInternship() {
  resumeData.internships.push({
    id: nextId(),
    date: '', org: '', role: '', bullets: ['']
  });
  renderInternshipList();
  updatePreview();
}
function removeInternship(id) {
  resumeData.internships = resumeData.internships.filter(e => e.id !== id);
  renderInternshipList();
  updatePreview();
}

function addProject() {
  resumeData.projects.push({
    id: nextId(),
    date: '', org: '', role: '', bullets: ['']
  });
  renderProjectList();
  updatePreview();
}
function removeProject(id) {
  resumeData.projects = resumeData.projects.filter(e => e.id !== id);
  renderProjectList();
  updatePreview();
}

function addBullet(dataPath) {
  const arr = eval(dataPath);
  arr.push('');
  refreshEditors();
  updatePreview();
}
function removeBullet(dataPath, index) {
  const arr = eval(dataPath);
  arr.splice(index, 1);
  refreshEditors();
  updatePreview();
}

function addSkill() {
  resumeData.skills.push('');
  renderSkillsList();
  updatePreview();
}
function removeSkill(index) {
  resumeData.skills.splice(index, 1);
  renderSkillsList();
  updatePreview();
}

function refreshEditors() {
  renderEducationList();
  renderInternshipList();
  renderProjectList();
  renderSkillsList();
}

// ========== Photo ==========

function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    resumeData.photo = e.target.result;
    updatePhotoPreview();
    updatePreview();
  };
  reader.readAsDataURL(file);
}
function updatePhotoPreview() {
  const preview = document.getElementById('photoPreview');
  if (resumeData.photo) {
    preview.innerHTML = `<img src="${resumeData.photo}" alt="photo">`;
  } else {
    preview.innerHTML = '<span class="placeholder">暂无照片</span>';
  }
}
function removePhoto() {
  resumeData.photo = null;
  document.getElementById('photoFile').value = '';
  updatePhotoPreview();
  updatePreview();
}

// ========== Theme Color ==========

function changeColor(swatch) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  swatch.classList.add('active');
  resumeData.themeColor = swatch.dataset.color;
  document.documentElement.style.setProperty('--resume-accent', resumeData.themeColor);
  updatePreview();
}

  resumeData = JSON.parse(JSON.stringify(sampleData));
  entryIdCounter = resumeData.education.length + resumeData.internships.length + resumeData.projects.length + 10;
  syncFormFields();
  refreshEditors();
  updatePhotoPreview();
  updatePreview();
}

function syncFormFields() {
  document.getElementById('hdr_title').value = resumeData.header.title;

  document.getElementById('hdr_tagline').value = resumeData.header.tagline;
  document.getElementById('bi_name').value = resumeData.basicInfo.name;

  document.getElementById('bi_gender').value = resumeData.basicInfo.gender;
  document.getElementById('bi_ethnicity').value = resumeData.basicInfo.ethnicity;
  document.getElementById('bi_political').value = resumeData.basicInfo.political;
  document.getElementById('bi_origin').value = resumeData.basicInfo.origin;
  document.getElementById('bi_phone').value = resumeData.basicInfo.phone;
  document.getElementById('bi_email').value = resumeData.basicInfo.email;
  document.getElementById('bi_school').value = resumeData.basicInfo.school;
  document.getElementById('bi_degree').value = resumeData.basicInfo.degree;

}

  if (!confirm('确定要清空所有内容吗？')) return;
  resumeData = {
    themeColor: '#3d6b7d',
    header: { title: '个人简历', subtitle: 'Personal resume', tagline: '细心从每一个小细节开始。' },
    photo: null,
    basicInfo: { name: '', age: '', gender: '', ethnicity: '', political: '', origin: '', phone: '', email: '', school: '', degree: '' },
    education: [], internships: [], projects: [], skills: [], selfEval: ''
  };
  entryIdCounter = 0;
  syncFormFields();
  refreshEditors();
  updatePhotoPreview();
  updatePreview();
}

function saveToLocal() {
  // Sync all form fields before saving
  updatePreview();
  localStorage.setItem('resumeData', JSON.stringify(resumeData));
  showToast('已保存到浏览器本地存储');
}

function loadFromLocal() {
  const saved = localStorage.getItem('resumeData');
  if (saved) {
    try {
      resumeData = JSON.parse(saved);
      entryIdCounter = Math.max(
        ...resumeData.education.map(e => e.id || 0),
        ...resumeData.internships.map(e => e.id || 0),
        ...resumeData.projects.map(e => e.id || 0),
        0
      ) + 1;
      syncFormFields();
      refreshEditors();
      updatePhotoPreview();
      updatePreview();
      return true;
    } catch(e) { return false; }
  }
  return false;
}

function exportPDF() {
  // Ensure preview is up to date
  updatePreview();
  // Trigger print dialog (user can "Save as PDF")
  setTimeout(() => {
    window.print();
  }, 100);
}

function toggleEditor() {
  document.getElementById('editorPanel').classList.toggle('collapsed');
}

// ========== Toast ==========

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:6px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}

// ========== Init ==========

window.addEventListener('DOMContentLoaded', function() {
  // Try to load from localStorage, otherwise load sample
  if (!loadFromLocal()) {
    loadSample();
  }
  updatePreview();
});

// Auto-save on input
let saveTimer = null;
document.addEventListener('input', function() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    updatePreview();
    localStorage.setItem('resumeData', JSON.stringify(resumeData));
  }, 1000);
});
</script>

</body>
</html>
