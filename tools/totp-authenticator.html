<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>2FA 验证器</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --card-bg: rgba(17, 24, 39, 0.85);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #22d3ee;
            --accent-dim: rgba(34, 211, 238, 0.15);
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --code-bg: rgba(0, 0, 0, 0.4);
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--bg-primary); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Mono', 'PingFang SC', 'Helvetica Neue', monospace;
            background: linear-gradient(160deg, #0a0e1a 0%, #0f172a 40%, #1e1b4b 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            -webkit-tap-highlight-color: transparent;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* 网格背景 */
        body::before {
            content: '';
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(34, 211, 238, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        .app-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
        }

        /* 头部 */
        .app-header {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeInDown 0.5s ease-out;
        }
        .app-header .shield-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.4));
        }
        .app-header h1 {
            font-size: 24px; font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header p {
            font-size: 13px; color: var(--text-muted);
            margin-top: 4px;
        }

        /* 输入卡片 */
        .input-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease-out 0.1s both;
        }
        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 11px; color: var(--text-muted);
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 6px; font-weight: 600;
        }
        .input-group input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 14px;
            padding: 16px 18px;
            font-size: 15px;
            color: var(--text-primary);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            letter-spacing: 1.5px;
        }
        .input-group input::placeholder {
            color: rgba(148, 163, 184, 0.5);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            letter-spacing: 0;
            font-size: 13px;
        }
        .input-group input:focus {
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12), 0 0 20px rgba(34, 211, 238, 0.08);
        }
        .security-note {
            display: flex; align-items: center; gap: 6px;
            margin-top: 12px;
            font-size: 11px; color: var(--text-muted);
            opacity: 0.7;
        }
        .security-note .lock-icon { font-size: 13px; }

        /* 结果区域 */
        .result-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            animation: fadeInUp 0.4s ease-out;
            display: none;
        }
        .result-card.visible { display: block; }

        .result-label {
            font-size: 11px; color: var(--text-muted);
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 16px; font-weight: 600;
        }

        .totp-display {
            background: var(--code-bg);
            border-radius: 16px;
            padding: 20px 16px 16px;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: rgba(255, 255, 255, 0.05);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 0 2px 2px 0;
            transition: width 1s linear;
        }
        .progress-fill.warning { background: linear-gradient(90deg, var(--warning), #f97316); }
        .progress-fill.danger { background: linear-gradient(90deg, var(--danger), #e11d48); }

        .code-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }
        .totp-code {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .btn-copy {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-copy:hover {
            background: var(--accent-dim);
            border-color: rgba(34, 211, 238, 0.3);
            color: var(--accent);
        }
        .btn-copy:active { transform: scale(0.92); }
        .btn-copy.copied {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success);
        }
        .btn-copy.idle {
            opacity: 0.3;
            pointer-events: none;
        }

        .timer-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        .timer-text {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        .timer-text.warning { color: var(--warning); }
        .timer-text.danger { color: var(--danger); }
        .timer-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        .timer-dot.warning { background: var(--warning); }
        .timer-dot.danger { background: var(--danger); animation: none; }

        .btn-clear {
            margin-top: 16px;
            background: transparent;
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear:hover {
            background: rgba(244, 63, 94, 0.1);
            border-color: rgba(244, 63, 94, 0.4);
            color: var(--danger);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            left: 50%; transform: translateX(-50%) translateY(80px);
            background: rgba(16, 185, 129, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px; font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 响应式 */
        @media screen and (max-width: 360px) {
            .totp-code { font-size: 30px; letter-spacing: 4px; }
            .input-card { padding: 16px; }
            .result-card { padding: 18px 16px; }
        }
        @media screen and (min-width: 481px) and (max-width: 768px) {
            .app-container { max-width: 480px; }
            .totp-code { font-size: 42px; }
        }
        @media screen and (min-width: 769px) and (max-width: 1024px) {
            .app-container { max-width: 520px; }
            .totp-code { font-size: 46px; letter-spacing: 8px; }
        }
        @media screen and (min-width: 1025px) {
            .app-container { max-width: 540px; }
        }
        @media screen and (orientation: landscape) and (max-height: 500px) {
            body { align-items: flex-start; padding: 12px 20px; }
            .app-header { margin-bottom: 12px; }
            .app-header .shield-icon { font-size: 28px; }
            .app-header h1 { font-size: 20px; }
            .input-card { padding: 14px; margin-bottom: 12px; }
            .input-group { margin-bottom: 10px; }
            .result-card { padding: 16px 14px; }
            .totp-code { font-size: 30px; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <span class="shield-icon">&#128737;</span>
            <h1>2FA Authenticator</h1>
            <p>输入密钥，即时生成验证码 · 不留存任何数据</p>
        </div>

        <div class="input-card">
            <div class="input-group">
                <label>Secret Key</label>
                <input type="text" id="secretKey" placeholder="粘贴 Base32 密钥（如 JBSWY3DPEHPK3PXP）" autocomplete="off" spellcheck="false">
            </div>
            <div class="security-note">
                <span class="lock-icon">&#128274;</span>
                密钥仅在内存中处理，关闭页面后自动清除，不会缓存到本地
            </div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-label">当前验证码</div>
            <div class="totp-display">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="code-row">
                    <div class="totp-code" id="totpCode">------</div>
                    <button class="btn-copy idle" id="btnCopy" onclick="copyCode()" title="复制验证码">&#128203;</button>
                </div>
            </div>
            <div class="timer-row">
                <div class="timer-dot" id="timerDot"></div>
                <span class="timer-text" id="timerText">30s 后刷新</span>
            </div>
            <button class="btn-clear" onclick="clearAll()">&#128465; 清除密钥</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function() {
        // ===== 安全策略 =====
        // 所有数据仅存在内存变量中，绝不写入 localStorage / sessionStorage / Cookie
        // 页面关闭时变量自动销毁

        let currentSecret = null;  // Uint8Array，仅内存
        let updateTimer = null;
        const PERIOD = 30;
        const DIGITS = 6;

        // ===== Base32 解码 =====
        const BASE32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        function base32Decode(str) {
            str = str.replace(/[\s=-]+/g, '').toUpperCase();
            let bits = '';
            for (let i = 0; i < str.length; i++) {
                const val = BASE32.indexOf(str[i]);
                if (val === -1) continue;
                bits += val.toString(2).padStart(5, '0');
            }
            const bytes = [];
            for (let i = 0; i + 8 <= bits.length; i += 8) {
                bytes.push(parseInt(bits.substr(i, 8), 2));
            }
            return new Uint8Array(bytes);
        }

        // ===== TOTP 生成 =====
        async function computeTOTP(secretBytes) {
            const key = await crypto.subtle.importKey(
                'raw', secretBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']
            );
            const epoch = Math.floor(Date.now() / 1000);
            const counter = Math.floor(epoch / PERIOD);
            const counterBytes = new Uint8Array(8);
            let tmp = counter;
            for (let i = 7; i >= 0; i--) {
                counterBytes[i] = tmp & 0xff;
                tmp = Math.floor(tmp / 256);
            }
            const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, counterBytes));
            const offset = sig[sig.length - 1] & 0x0f;
            let binary = 0;
            for (let i = 0; i < 4; i++) {
                binary = (binary << 8) | sig[offset + i];
            }
            binary &= 0x7fffffff;
            return (binary % Math.pow(10, DIGITS)).toString().padStart(DIGITS, '0');
        }

        function getRemaining() {
            return PERIOD - (Math.floor(Date.now() / 1000) % PERIOD);
        }

        // ===== UI 元素 =====
        const secretInput = document.getElementById('secretKey');
        const resultCard = document.getElementById('resultCard');
        const totpCodeEl = document.getElementById('totpCode');
        const progressFill = document.getElementById('progressFill');
        const timerText = document.getElementById('timerText');
        const timerDot = document.getElementById('timerDot');
        const btnCopy = document.getElementById('btnCopy');

        // ===== 生成 =====
        window.generate = async function() {
            const raw = secretInput.value.trim();
            if (!raw) {
                showToast('请输入 Secret Key', true);
                secretInput.focus();
                return;
            }

            // 去除常见分隔符后，检查是否只含合法 Base32 字符
            const stripped = raw.replace(/[\s=-]+/g, '');
            if (!/^[A-Za-z2-7]+$/.test(stripped)) {
                showToast('包含无效字符，请输入正确的 Base32 密钥', true);
                return;
            }

            const clean = stripped.toUpperCase();
            if (clean.length < 16) {
                showToast('密钥太短（至少16位 Base32 字符）', true);
                return;
            }

            // 检测是否像普通英文文本而非密钥
            // 真实 Base32 密钥通常包含数字 2-7，纯字母且长度刚好 16-30 的需额外提醒
            const hasDigits = /[2-7]/.test(clean);
            if (!hasDigits && clean.length <= 32) {
                showToast('该内容可能不是密钥，请确认后重新输入', true);
                return;
            }

            try {
                currentSecret = base32Decode(clean);
            } catch(e) {
                showToast('密钥格式无效', true);
                return;
            }

            // 立即显示结果
            resultCard.classList.add('visible');
            btnCopy.classList.remove('idle');
            await updateDisplay();
            startTimer();
            showToast('验证码已生成');
        };

        // ===== 更新显示 =====
        async function updateDisplay() {
            if (!currentSecret) return;
            try {
                const code = await computeTOTP(currentSecret);
                totpCodeEl.textContent = code;
            } catch(e) {
                totpCodeEl.textContent = 'ERROR';
            }
            updateProgress();
        }

        function updateProgress() {
            const remaining = getRemaining();
            const pct = (remaining / PERIOD) * 100;
            progressFill.style.width = pct + '%';

            const isWarning = remaining <= 10 && remaining > 5;
            const isDanger = remaining <= 5;

            progressFill.className = 'progress-fill' + (isDanger ? ' danger' : isWarning ? ' warning' : '');
            timerText.className = 'timer-text' + (isDanger ? ' danger' : isWarning ? ' warning' : '');
            timerText.textContent = remaining + 's 后刷新';
            timerDot.className = 'timer-dot' + (isDanger ? ' danger' : isWarning ? ' warning' : '');
        }

        // ===== 定时器 =====
        function startTimer() {
            if (updateTimer) clearInterval(updateTimer);
            updateDisplay();
            updateTimer = setInterval(updateDisplay, 1000);
        }

        // ===== 复制 =====
        window.copyCode = function() {
            const code = totpCodeEl.textContent;
            if (!code || code === '------' || code === 'ERROR') return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code);
            } else {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }

            btnCopy.classList.add('copied');
            btnCopy.innerHTML = '&#10003;';
            setTimeout(() => {
                btnCopy.classList.remove('copied');
                btnCopy.innerHTML = '&#128203;';
            }, 1500);
            showToast('验证码已复制');
        };

        // ===== 清除 =====
        window.clearAll = function(skipInput) {
            currentSecret = null;
            if (updateTimer) { clearInterval(updateTimer); updateTimer = null; }
            resultCard.classList.remove('visible');
            totpCodeEl.textContent = '------';
            btnCopy.classList.add('idle');
            btnCopy.classList.remove('copied');
            if (!skipInput) {
                secretInput.value = '';
                secretInput.focus();
            }
            showToast('密钥已从内存中清除');
        };

        // ===== Toast =====
        let toastTimer = null;
        function showToast(msg, isWarn) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isWarn
                ? 'rgba(245, 158, 11, 0.95)'
                : 'rgba(16, 185, 129, 0.95)';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ===== 自动检测输入 =====
        let detectTimer = null;
        function scheduleDetect() {
            clearTimeout(detectTimer);
            detectTimer = setTimeout(() => {
                const raw = secretInput.value.trim().replace(/\s/g, '');
                if (!raw) {
                    // 输入框清空时隐藏结果
                    window.clearAll();
                    return;
                }
                window.generate();
            }, 300);
        }

        secretInput.addEventListener('input', scheduleDetect);
        secretInput.addEventListener('paste', function() {
            // 粘贴后稍等一下让值写入，再触发检测
            setTimeout(scheduleDetect, 50);
        });

        // ===== 键盘 =====
        secretInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                clearTimeout(detectTimer);
                window.generate();
            }
        });

        // ===== 页面卸载时清除 =====
        window.addEventListener('beforeunload', function() {
            currentSecret = null;
        });

        // ===== 阻止意外缓存 =====
        // 通过 meta 标签已禁止缓存，此处额外清理
        if ('storage' in window) {
            // 不使用任何 storage
        }
    })();
    </script>
</body>
</html>
