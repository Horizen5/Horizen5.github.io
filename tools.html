<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>我的工具</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #818cf8;
            --primary-bg: rgba(129, 140, 248, 0.15);
            --shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.25);
            --shadow-hover: 0 10px 40px -10px rgba(129, 140, 248, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: pan-x pan-y;
        }

        /* 顶部导航 */
        .top-bar {
            position: sticky; top: 0; z-index: 50;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex; align-items: center; gap: 16px;
        }
        .back-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
            font-size: 18px; text-decoration: none;
        }
        .back-btn:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-bg); }
        .top-bar h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .top-bar .count {
            font-size: 12px; color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px; border-radius: 20px;
            margin-left: auto; font-weight: 500;
        }

        /* 主内容 */
        .main-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* 工具网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* 工具卡片 */
        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }
        .tool-card::before {
            content: '';
            position: absolute; top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--primary), #c084fc);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tool-card:hover {
            background: var(--card-hover);
            border-color: rgba(129, 140, 248, 0.2);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .tool-card:hover::before { opacity: 1; }
        .tool-card:active { transform: translateY(0) scale(0.98); }

        .tool-card-header {
            display: flex; align-items: flex-start; gap: 14px;
        }
        .tool-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tool-icon.sleep { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2)); }
        .tool-icon.totp { background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(56, 189, 248, 0.2)); }
        .tool-icon.resume { background: linear-gradient(135deg, rgba(61, 107, 125, 0.2), rgba(91, 143, 163, 0.2)); }

        .tool-info { flex: 1; min-width: 0; }
        .tool-name {
            font-size: 17px; font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .tool-desc {
            font-size: 13px; color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tool-tags {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .tool-tag {
            font-size: 11px; font-weight: 500;
            padding: 4px 10px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
        }
        .tool-tag.highlight {
            background: var(--primary-bg);
            border-color: rgba(129, 140, 248, 0.2);
            color: var(--primary);
        }

        .tool-arrow {
            position: absolute; bottom: 20px; right: 20px;
            color: var(--text-muted);
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.3s;
            font-size: 16px;
        }
        .tool-card:hover .tool-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
        .empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; line-height: 1.6; }

        /* 响应式 */
        @media screen and (max-width: 640px) {
            .main-content { padding: 16px 14px 32px; }
            .tools-grid { grid-template-columns: 1fr; gap: 12px; }
            .tool-card { padding: 20px; }
            .top-bar { padding: 14px 16px; }
        }
        @media screen and (min-width: 641px) and (max-width: 1024px) {
            .tools-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media screen and (min-width: 1025px) {
            .tools-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn" title="返回主页">&#8592;</a>
        <h1>我的工具</h1>
        <span class="count" id="toolCount">2 个工具</span>
    </div>

    <div class="main-content">
        <div class="tools-grid" id="toolsGrid">
            <!-- 睡眠时间计算器 -->
            <a href="tools/sleep-calculator.html" class="tool-card">
                <div class="tool-card-header">
                    <div class="tool-icon sleep">&#127769;</div>
                    <div class="tool-info">
                        <div class="tool-name">睡眠时间计算器</div>
                        <div class="tool-desc">根据科学睡眠周期，计算最佳入睡与起床时间，帮助你获得更高质量的睡眠。</div>
                    </div>
                </div>
                <div class="tool-tags">
                    <span class="tool-tag highlight">实用</span>
                    <span class="tool-tag">健康</span>
                    <span class="tool-tag">HTML/CSS/JS</span>
                </div>
                <span class="tool-arrow">&#8594;</span>
            </a>

            <!-- 2FA 验证器 -->
            <a href="tools/totp-authenticator.html" class="tool-card">
                <div class="tool-card-header">
                    <div class="tool-icon totp">&#128737;</div>
                    <div class="tool-info">
                        <div class="tool-name">2FA 验证器</div>
                        <div class="tool-desc">基于 TOTP 标准的双因素验证码生成器，输入密钥即时生成验证码，不留存任何数据。</div>
                    </div>
                </div>
                <div class="tool-tags">
                    <span class="tool-tag highlight">安全</span>
                    <span class="tool-tag">加密</span>
                    <span class="tool-tag">Web Crypto</span>
                </div>
                <span class="tool-arrow">&#8594;</span>
            </a>

            <!-- 简历制作工具 -->
            <a href="tools/resume-builder.html" class="tool-card">
                <div class="tool-card-header">
                    <div class="tool-icon resume">&#128196;</div>
                    <div class="tool-info">
                        <div class="tool-name">简历制作工具</div>
                        <div class="tool-desc">自助填写简历信息，实时预览效果，支持主题配色切换与照片上传，一键导出 A4 尺寸 PDF。</div>
                    </div>
                </div>
                <div class="tool-tags">
                    <span class="tool-tag highlight">实用</span>
                    <span class="tool-tag">求职</span>
                    <span class="tool-tag">PDF导出</span>
                </div>
                <span class="tool-arrow">&#8594;</span>
            </a>
        </div>
    </div>

    <script>
        // 更新工具计数
        const cards = document.querySelectorAll('.tool-card');
        document.getElementById('toolCount').textContent = cards.length + ' 个工具';
    </script>
</body>
</html>
