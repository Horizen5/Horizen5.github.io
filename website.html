<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站聚合</title>
    <!-- 引入主页统一字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 默认使用一张极美的云海日落图作为背景 */
            --bg-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2832&auto=format&fit=crop');
            
            --primary: #764ba2; /* 标题左侧的强调紫色 */
            --card-bg: #ffffff;
            --card-border: #f0f0f0;
            --card-hover-bg: #f8fafc;
            --card-hover-border: #e2e8f0;
            
            --text-title: #ffffff; /* 顶部大标题颜色 */
            --text-main: #1f2937;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
        }

        [data-theme="dark"] {
            --primary: #a78bfa;
            --card-bg: rgba(30, 41, 59, 0.95);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-hover-bg: rgba(40, 50, 70, 0.95);
            --card-hover-border: rgba(167, 139, 250, 0.3);
            
            --text-title: #f8fafc;
            --text-main: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            color: var(--text-main);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* 增加一层深色遮罩，让白色文字和卡片更突出，完美还原截图氛围 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
            transition: background 0.3s ease;
        }
        [data-theme="dark"] body::before { background: rgba(0, 0, 0, 0.7); }

        .layout-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部搜索框 (一比一还原) */
        .search-wrapper {
            width: 100%;
            max-width: 500px;
            position: relative;
            margin-bottom: 40px;
            z-index: 10;
        }
        .search-box {
            width: 100%;
            height: 44px;
            background: var(--card-bg);
            border-radius: 999px;
            padding: 10px 24px 10px 48px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }
        .search-box:focus-within { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            pointer-events: none;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 14px;
            color: var(--text-main);
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-clear {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: none;
        }
        .search-clear.show { display: block; }
        .search-clear:hover { color: var(--text-main); }
        
        .search-count {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            display: none;
            white-space: nowrap;
        }
        .search-count.show { display: block; }

        /* 大标题与副标题 */
        header { text-align: center; margin-bottom: 40px; }
        header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        header p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }

        /* 面包屑胶囊 */
        .breadcrumb {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-md);
            font-size: 14px;
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }
        .breadcrumb-home {
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .breadcrumb-home:hover { opacity: 0.8; }
        .breadcrumb-sep { color: var(--text-muted); }
        .breadcrumb-current { color: var(--text-main); font-weight: 600; }

        /* 内容挂载点 */
        #app { width: 100%; }

        /* 分类大白板 (一比一还原截图中的白色大框) */
        .category-block {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }
        .category-block.hidden { display: none; }
        
        /* 带有紫色标的分类标题 */
        .category-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 18px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* 网站卡片网格 */
        .site-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        /* 单个网站小卡片 */
        .site-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .site-card:hover {
            background: var(--card-hover-bg);
            border-color: var(--card-hover-border);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .site-card.hidden { display: none; }

        /* 卡片内联图标 */
        .favicon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }
        [data-theme="dark"] .favicon { background: rgba(255,255,255,0.05); }
        .favicon img { width: 100%; height: 100%; object-fit: cover; background: #fff; }

        /* 卡片文字 */
        .site-info { flex: 1; min-width: 0; }
        .site-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .site-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            margin-top: 4px;
        }

        /* 搜索高亮 */
        .highlight {
            background: rgba(118, 75, 162, 0.2);
            color: var(--primary);
            border-radius: 2px;
            padding: 0 2px;
        }

        /* 隐藏的右键编辑提示 */
        .edit-hint {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: var(--shadow-sm);
        }
        .site-card:hover .edit-hint { display: flex; }

        /* 精致的角落悬浮按钮 */
        .floating-btn {
            position: fixed;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .floating-btn:hover {
            transform: scale(1.05);
            color: var(--primary);
            border-color: var(--card-hover-border);
        }
        .floating-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .btn-home { top: 20px; left: 20px; }
        .btn-theme { top: 20px; right: 20px; }
        .btn-top {
            bottom: 30px;
            right: 20px;
            border-radius: 50%;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
        }
        .btn-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .btn-top:hover { transform: translateY(-3px) scale(1.05); }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-md);
            width: 100%;
        }
        .empty-state svg { width: 48px; height: 48px; fill: currentColor; margin-bottom: 16px; opacity: 0.5; }

        /* ===== 新增：汉堡菜单与毛玻璃侧边栏 ===== */
        .btn-menu {
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 210; /* 关键修复：提升层级，确保它永远浮在侧边栏的最上方 */
        }
        .btn-menu.active {
            color: var(--primary); /* 变成X时，高亮显示主题色 */
            border-color: var(--card-hover-border);
        }
        .btn-menu span {
            display: block;
            width: 18px;
            height: 2px;
            background: currentColor;
            border-radius: 2px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }
        .btn-menu.active span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        .btn-menu.active span:nth-child(2) { opacity: 0; }
        .btn-menu.active span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

        /* 调整原本 btn-home 的位置，为汉堡菜单腾出空间 */
        .btn-home { top: 20px; left: 80px; }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.show { opacity: 1; visibility: visible; }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--card-border);
            box-shadow: 4px 0 24px rgba(0,0,0,0.1);
            z-index: 199;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 80px 0 20px;
        }
        .sidebar.show { transform: translateX(0); }
        
        .sidebar-header {
            padding: 0 24px 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .sidebar-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .sidebar-item:hover {
            background: var(--card-hover-bg);
            color: var(--primary);
        }
        .sidebar-item.active {
            background: rgba(118, 75, 162, 0.1);
            color: var(--primary);
            font-weight: 600;
        }
        [data-theme="dark"] .sidebar-item.active { background: rgba(167, 139, 250, 0.15); }
        
        .sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--primary);
            border-radius: 0 3px 3px 0;
            transition: height 0.3s;
        }
        .sidebar-item.active::before { height: 20px; }

        /* 模态框 (依然保留强大的编辑功能) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            color: var(--text-main);
        }
        .modal h3 { font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid var(--card-border); border-radius: 10px; background: transparent; color: var(--text-main); outline: none; }
        .form-group input:focus { border-color: var(--primary); }
        .icon-preview { width: 56px; height: 56px; border-radius: 12px; background: #f1f5f9; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; overflow: hidden; }
        [data-theme="dark"] .icon-preview { background: rgba(255,255,255,0.05); }
        .icon-preview img { width: 100%; height: 100%; object-fit: cover; }
        .upload-area { border: 1px dashed var(--text-muted); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; font-size: 13px; color: var(--text-secondary); }
        .upload-area:hover { border-color: var(--primary); color: var(--primary); }
        .upload-area input { display: none; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .btn-group button { flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--card-border); color: var(--text-secondary); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-group button:hover { opacity: 0.8; }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .layout-container { padding: 80px 16px 40px; }
            header h1 { font-size: 2rem; }
            .category-block { padding: 20px; }
            .site-grid { grid-template-columns: 1fr; gap: 12px; }
            .btn-home { left: 70px; } /* 移动端适当缩小间距 */
            .sidebar { width: 260px; }
        }
    </style>
</head>
<body>
    <!-- 新增：侧边栏按钮 (汉堡/X) -->
    <button class="floating-btn btn-menu" id="menuToggle" title="分类菜单">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- 悬浮主页按钮 (小房子) -->
    <a href="index.html" class="floating-btn btn-home" title="回到主页">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>

    <!-- 悬浮暗黑模式切换 -->
    <button class="floating-btn btn-theme" id="themeToggle" title="切换模式">
        <svg id="moonIcon" viewBox="0 0 24 24"><path d="M9 2c-1.05 0-2.05.16-3 .46 1.69 1.24 2.79 3.24 2.79 5.54 0 3.87-3.13 7-7 7-1.06 0-2.06-.24-2.98-.66C.32 16.05 3.39 19 7 19c4.97 0 9-4.03 9-9 0-3.39-2.95-6.46-6.66-6.98C9.16 3.05 9.58 2.54 9 2z"/></svg>
        <svg id="sunIcon" viewBox="0 0 24 24" style="display:none"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
    </button>

    <!-- 悬浮回到顶部 -->
    <button class="floating-btn btn-top" id="backToTop" title="回到顶部">
        <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </button>

    <!-- 新增：侧边栏遮罩与结构 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">资源导航</div>
        <div class="sidebar-items" id="sidebarItems">
            <!-- 侧边栏菜单项将由 JS 动态生成 -->
        </div>
    </aside>

    <div class="layout-container">
        
        <!-- 搜索框区域 -->
        <div class="search-wrapper">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="搜索工具名称、分类..." autocomplete="off">
                <button class="search-clear" id="searchClear">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="search-count" id="searchCount"></div>
        </div>

        <!-- 标题区域 -->
        <header>
            <h1>网站聚合</h1>
            <p>共收录多个分类，方便快速访问各类优质网站</p>
        </header>

        <!-- 面包屑区域 -->
        <div class="breadcrumb" id="breadcrumb">
            <span class="breadcrumb-home" onclick="resetSearch()">全部</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current" id="breadcrumbCurrent">聚合资源</span>
        </div>

        <!-- 动态卡片容器 -->
        <div id="app"></div>
        
        <!-- 搜索空状态 -->
        <div class="empty-state" id="emptyState" style="display:none">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <p>未找到匹配的内容，试试其他关键词</p>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>编辑网站配置</h3>
            <div class="form-group">
                <label>网站名称</label>
                <input type="text" id="editName" placeholder="输入网站名称">
            </div>
            <div class="form-group">
                <label>链接地址</label>
                <input type="url" id="editUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label>图标预览</label>
                <div class="icon-preview" id="editIconPreview">?</div>
            </div>
            <div class="form-group">
                <label>备用文字图标 (1-2个字)</label>
                <input type="text" id="editIcon" placeholder="输入1-2个字符" maxlength="2">
            </div>
            <div class="form-group">
                <label>自定义上传图像</label>
                <div class="upload-area" id="iconUploadArea">
                    <span>📎 点击上传自定义图像</span>
                    <input type="file" id="editIconFile" accept="image/*">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="editCancel">取消</button>
                <button class="btn-danger" id="editDelete">删除</button>
                <button class="btn-primary" id="editSave">保存</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
    <script>
        let defaultSites = [];
        let sites = [];
        let editingItem = null;
        let editingCatIdx = null;
        let editingItemIdx = null;
        let customIconData = null;
        let currentCategoryIndex = -1; // 新增：用于记录当前选中的分类，-1代表全部

        // ===== 基础功能初始化 =====
        function initTheme() {
            const saved = localStorage.getItem('siteAggregatorDarkMode');
            const globalSaved = localStorage.getItem('theme'); // 兼容主页
            let isDark = (saved === 'true') || (globalSaved === 'dark');
            
            if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
            updateThemeIcon(isDark);

            document.getElementById('themeToggle').addEventListener('click', () => {
                isDark = document.documentElement.getAttribute('data-theme') !== 'dark';
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('siteAggregatorDarkMode', 'true');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('siteAggregatorDarkMode', 'false');
                }
                updateThemeIcon(isDark);
            });
        }

        function updateThemeIcon(isDark) {
            document.getElementById('moonIcon').style.display = isDark ? 'none' : 'block';
            document.getElementById('sunIcon').style.display = isDark ? 'block' : 'none';
        }

        function initBackToTop() {
            const btn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                btn.classList.toggle('show', window.scrollY > 300);
            });
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        // ===== 数据加载与渲染 =====
        async function loadSites() {
            try {
                // 如果实际环境中没有 assets/data/sites.json，这里提供一套截图上的 mock 数据保底渲染
                const response = await fetch('assets/data/sites.json');
                if (!response.ok) throw new Error('网络请求失败');
                defaultSites = await response.json();
            } catch (err) {
                console.warn('使用本地兜底模板数据模拟截图效果');
                defaultSites = [
                    {
                        category: "学习资源",
                        items: [
                            { name: "ChatGPT学习手册", url: "https://feishu.cn", domain: "feishu.cn", icon: "CG" },
                            { name: "CS自学指南", url: "https://csdiy.wiki", domain: "csdiy.wiki", icon: "CS" },
                            { name: "菜鸟教程", url: "https://runoob.com", domain: "runoob.com", icon: "</>" },
                            { name: "Python入门指南", url: "https://runoob.com", domain: "runoob.com", icon: "Py" },
                            { name: "图欧学习资源导航", url: "https://upnb.top", domain: "upnb.top", icon: "图" },
                            { name: "学习资源船舱", url: "https://tuostudy.top", domain: "tuostudy.top", icon: "舱" },
                            { name: "学习盲打", url: "https://typingclub.com", domain: "typingclub.com", icon: "打" },
                            { name: "大学生的他的教程", url: "https://notion.site", domain: "notion.site", icon: "N" },
                            { name: "Coursera", url: "https://coursera.org", domain: "coursera.org", icon: "C" },
                            { name: "中国大学MOOC", url: "https://icourse163.org", domain: "icourse163.org", icon: "M" }
                        ]
                    }
                ];
            }
            
            const saved = localStorage.getItem('siteAggregatorSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                sites = settings.sites || JSON.parse(JSON.stringify(defaultSites));
            } else {
                sites = JSON.parse(JSON.stringify(defaultSites));
            }
        }

        function saveSettings() {
            localStorage.setItem('siteAggregatorSettings', JSON.stringify({ sites: sites }));
        }

        // ===== 侧边栏与内容过滤逻辑 =====
        function initSidebar() {
            const btn = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const container = document.getElementById('sidebarItems');

            // 开关侧边栏
            function toggleSidebar() {
                btn.classList.toggle('active');
                sidebar.classList.toggle('show');
                overlay.classList.toggle('show');
            }

            btn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);

            // 渲染侧边栏内容
            function renderSidebarItems() {
                let html = `<div class="sidebar-item ${currentCategoryIndex === -1 ? 'active' : ''}" data-index="-1">全部资源</div>`;
                sites.forEach((cat, idx) => {
                    html += `<div class="sidebar-item ${currentCategoryIndex === idx ? 'active' : ''}" data-index="${idx}">${cat.category}</div>`;
                });
                container.innerHTML = html;

                // 绑定点击事件，过滤并平滑滚动
                container.querySelectorAll('.sidebar-item').forEach(item => {
                    item.addEventListener('click', function() {
                        currentCategoryIndex = parseInt(this.dataset.index);
                        renderSidebarItems(); // 更新高亮
                        
                        if (window.innerWidth <= 768) toggleSidebar(); // 手机端点击后自动收起
                        
                        if (currentCategoryIndex === -1) {
                            // 点击全部，显示所有区块并滚动到顶部
                            document.querySelectorAll('.category-block').forEach(b => b.classList.remove('hidden'));
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        } else {
                            // 点击特定分类，隐藏其他，显示该分类，并利用 DOM 渲染强制跳过过滤逻辑造成的视觉差
                            document.querySelectorAll('.category-block').forEach((b, i) => {
                                if (i === currentCategoryIndex) {
                                    b.classList.remove('hidden');
                                    // 稍微延迟滚动，确保 DOM 已经显示
                                    setTimeout(() => b.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
                                } else {
                                    b.classList.add('hidden');
                                }
                            });
                        }
                    });
                });
            }
            
            // 每次数据加载或渲染后，调用一次生成菜单
            renderSidebarItems();
        }

        // 核心渲染逻辑：一比一复刻白色大卡片
        function render() {
            const app = document.getElementById('app');
            let html = '';
            
            for (let ci = 0; ci < sites.length; ci++) {
                const cat = sites[ci];
                // 每一个分类就是一个白色大块，完美契合截图
                html += `<div class="category-block" data-cat-idx="${ci}">
                            <div class="category-title">${cat.category}</div>
                            <div class="site-grid">`;
                
                for (let ii = 0; ii < cat.items.length; ii++) {
                    const item = cat.items[ii];
                    const namePinyin = window.pinyinPro ? pinyinPro.pinyin(item.name, { toneType: 'none', type: 'array' }).join('') : '';
                    const descPinyin = item.desc && window.pinyinPro ? pinyinPro.pinyin(item.desc, { toneType: 'none', type: 'array' }).join('') : '';
                    
                    html += `<a href="${item.url}" class="site-card" target="_blank" rel="noopener" data-name="${item.name.toLowerCase()}" data-pinyin="${namePinyin}">
                                <div class="edit-hint" data-ci="${ci}" data-ii="${ii}" title="右键编辑">✎</div>
                                <div class="favicon" data-domain="${item.domain || ''}">
                                    ${item.customIcon ? `<img src="${item.customIcon}">` : item.icon || '?'}
                                </div>
                                <div class="site-info">
                                    <span class="site-name">${item.name}</span>
                                    <span class="site-desc">${item.desc || item.domain || '点击访问'}</span>
                                </div>
                             </a>`;
                }
                html += `</div></div>`;
            }
            app.innerHTML = html;
            
            bindCardEvents();
            loadFavicons();
        }

        // 智能获取网站图标
        function loadFavicons() {
            document.querySelectorAll('.favicon[data-domain]').forEach(el => {
                const domain = el.dataset.domain;
                if (!domain || el.querySelector('img')) return; // 已有自定义图片则跳过
                
                let tried = 0;
                function tryLoad() {
                    if (tried >= 2) return; // 回退为文字
                    const sources = [
                        `https://api.iowen.cn/favicon/${domain}.png`,
                        `https://www.google.com/s2/favicons?sz=64&domain=${domain}`
                    ];
                    
                    const img = new Image();
                    img.onload = () => { el.innerHTML = ''; el.appendChild(img); };
                    img.onerror = () => { tried++; tryLoad(); };
                    img.src = sources[tried];
                }
                tryLoad();
            });
        }

        // ===== 搜索功能 =====
        function initSearch() {
            const input = document.getElementById('searchInput');
            const clear = document.getElementById('searchClear');
            const count = document.getElementById('searchCount');
            const empty = document.getElementById('emptyState');
            const breadcrumbCurrent = document.getElementById('breadcrumbCurrent');

            input.addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();
                clear.classList.toggle('show', query.length > 0);
                
                let matchCount = 0;
                let activeCats = new Set();
                
                document.querySelectorAll('.category-block').forEach(block => {
                    let catHasMatch = false;
                    const catName = block.querySelector('.category-title').textContent.toLowerCase();
                    
                    block.querySelectorAll('.site-card').forEach(card => {
                        const name = card.dataset.name;
                        const pinyin = card.dataset.pinyin;
                        const isMatch = name.includes(query) || pinyin.includes(query) || catName.includes(query);
                        
                        card.classList.toggle('hidden', !isMatch && query !== '');
                        if (isMatch || query === '') {
                            catHasMatch = true;
                            if(query !== '') matchCount++;
                        }
                        
                        // 高亮处理
                        const nameEl = card.querySelector('.site-name');
                        if (query !== '' && name.includes(query)) {
                            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                            nameEl.innerHTML = itemOriginalNames[name] ? itemOriginalNames[name].replace(regex, '<span class="highlight">$1</span>') : name.replace(regex, '<span class="highlight">$1</span>');
                        } else {
                            nameEl.innerHTML = itemOriginalNames[name] || card.querySelector('.site-name').textContent;
                        }
                    });
                    
                    block.classList.toggle('hidden', !catHasMatch && query !== '');
                    if(catHasMatch) activeCats.add(catName);
                });

                if (query === '') {
                    empty.style.display = 'none';
                    count.classList.remove('show');
                    breadcrumbCurrent.textContent = '聚合资源';
                } else {
                    empty.style.display = matchCount === 0 ? 'block' : 'none';
                    count.textContent = `找到 ${matchCount} 个结果`;
                    count.classList.add('show');
                    // 面包屑显示搜索状态
                    breadcrumbCurrent.textContent = matchCount > 0 ? `搜索: "${query}"` : '无结果';
                }
            });

            clear.addEventListener('click', () => {
                input.value = '';
                input.dispatchEvent(new Event('input'));
                input.focus();
            });
        }
        
        // 缓存原始标题用于高亮恢复
        const itemOriginalNames = {};
        
        window.resetSearch = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }

        // ===== 模态框编辑逻辑 =====
        function bindCardEvents() {
            document.querySelectorAll('.site-card').forEach(card => {
                const hint = card.querySelector('.edit-hint');
                const title = card.querySelector('.site-name').textContent;
                itemOriginalNames[title.toLowerCase()] = title; // 保存原始名称
                
                card.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    openEditModal(parseInt(hint.dataset.ci), parseInt(hint.dataset.ii));
                });
            });
        }

        function openEditModal(ci, ii) {
            editingCatIdx = ci;
            editingItemIdx = ii;
            editingItem = sites[ci].items[ii];
            customIconData = editingItem.customIcon || null;

            document.getElementById('editName').value = editingItem.name;
            document.getElementById('editUrl').value = editingItem.url;
            document.getElementById('editIcon').value = editingItem.icon || '?';
            updateIconPreview();

            document.getElementById('editModal').classList.add('active');
        }

        function updateIconPreview() {
            const preview = document.getElementById('editIconPreview');
            if (customIconData) {
                preview.innerHTML = `<img src="${customIconData}">`;
            } else {
                preview.innerHTML = '';
                preview.textContent = document.getElementById('editIcon').value || '?';
            }
        }

        function initModals() {
            const modalOverlay = document.getElementById('editModal');
            
            document.getElementById('editCancel').addEventListener('click', () => modalOverlay.classList.remove('active'));
            
            document.getElementById('editSave').addEventListener('click', () => {
                if (editingItem) {
                    editingItem.name = document.getElementById('editName').value;
                    editingItem.url = document.getElementById('editUrl').value;
                    editingItem.icon = document.getElementById('editIcon').value;
                    try { editingItem.domain = new URL(editingItem.url).hostname; } catch(e){}
                    
                    if (customIconData) editingItem.customIcon = customIconData;
                    else delete editingItem.customIcon;
                    
                    saveSettings();
                    render();
                }
                modalOverlay.classList.remove('active');
            });
            
            document.getElementById('editDelete').addEventListener('click', () => {
                if (editingCatIdx !== null && editingItemIdx !== null) {
                    sites[editingCatIdx].items.splice(editingItemIdx, 1);
                    saveSettings();
                    render();
                }
                modalOverlay.classList.remove('active');
            });

            document.getElementById('editIcon').addEventListener('input', updateIconPreview);
            document.getElementById('iconUploadArea').addEventListener('click', () => document.getElementById('editIconFile').click());
            
            document.getElementById('editIconFile').addEventListener('change', function() {
                if (this.files[0]) {
                    const reader = new FileReader();
                    reader.onload = e => { customIconData = e.target.result; updateIconPreview(); };
                    reader.readAsDataURL(this.files[0]);
                }
            });

            modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });
        }

        // ===== 启动核心引擎 =====
        async function init() {
            initTheme();
            initBackToTop();
            await loadSites();
            
            function waitForPinyinPro() {
                if(window.pinyinPro) {
                    render();
                    initSearch();
                    initSidebar(); // 初始化侧边栏
                    initModals();
                } else {
                    setTimeout(waitForPinyinPro, 100);
                }
            }
            waitForPinyinPro();
        }

        init();
    </script>
</body>
</html>
