<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站聚合</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-body: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255,255,255,0.95);
            --card-hover: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-muted: #999;
            --border-color: #eee;
            --sidebar-bg: rgba(255,255,255,0.95);
            --item-hover-bg: #f5f3ff;
            --item-active-bg: #f0edff;
            --shadow: rgba(0,0,0,0.1);
            --shadow-md: rgba(0,0,0,0.15);
            --shadow-lg: rgba(0,0,0,0.2);
        }
        [data-theme="dark"] {
            --primary: #8b9dc3;
            --secondary: #a78bfa;
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --bg-body: #0f0f23;
            --card-bg: rgba(30,30,50,0.95);
            --card-hover: rgba(40,40,70,0.98);
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #888;
            --border-color: #333;
            --sidebar-bg: rgba(20,20,40,0.98);
            --item-hover-bg: rgba(102,126,234,0.15);
            --item-active-bg: rgba(102,126,234,0.25);
            --shadow: rgba(0,0,0,0.3);
            --shadow-md: rgba(0,0,0,0.4);
            --shadow-lg: rgba(0,0,0,0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            transition: background 0.5s ease;
            color: var(--text-primary);
        }
        body.custom-wallpaper {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body.custom-wallpaper::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }

        /* ===== 汉堡菜单按钮 ===== */
        .hamburger-btn {
            position: fixed;
            left: 16px;
            top: 16px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px var(--shadow-md);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .hamburger-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-lg);
        }
        .hamburger-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .hamburger-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ===== 固定主页按钮 ===== */
        .fixed-home-btn {
            position: fixed;
            right: 20px;
            top: 16px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-gradient);
            border: none;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }
        .fixed-home-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        .fixed-home-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* ===== 回到顶部按钮 ===== */
        .back-to-top {
            position: fixed;
            right: 20px;
            bottom: 30px;
            z-index: 200;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-gradient);
            border: none;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            color: white;
        }
        .back-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        .back-to-top svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* ===== 暗黑模式切换按钮 ===== */
        .theme-toggle {
            position: fixed;
            right: 20px;
            top: 72px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px var(--shadow-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-lg);
        }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* ===== 搜索框 ===== */
        .search-box {
            position: fixed;
            left: 50%;
            top: 16px;
            transform: translateX(-50%);
            z-index: 199;
            width: 90%;
            max-width: 500px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px var(--shadow-md);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            box-shadow: 0 6px 20px var(--shadow-lg);
            border-color: var(--primary);
        }
        .search-box svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            flex-shrink: 0;
        }
        .search-box input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 15px;
            color: var(--text-primary);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box .search-clear {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            padding: 2px 6px;
            border-radius: 50%;
            transition: all 0.2s;
            display: none;
        }
        .search-box .search-clear:hover {
            background: var(--item-hover-bg);
            color: var(--primary);
        }
        .search-box .search-clear.show {
            display: block;
        }
        .search-count {
            position: absolute;
            bottom: -24px;
            left: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 2px 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px var(--shadow);
            display: none;
        }
        .search-count.show {
            display: block;
        }

        /* ===== 侧边栏 ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .sidebar {
            width: 280px;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0 24px 24px 0;
            padding: 80px 0 20px 0;
            box-shadow: 4px 0 30px var(--shadow-md);
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 199;
            transform: translateX(-100%);
        }
        .sidebar.show {
            transform: translateX(0);
        }
        .sidebar-header {
            padding: 0 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .sidebar-header span {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .sidebar-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-muted);
            padding: 6px;
            line-height: 1;
            border-radius: 8px;
            transition: all 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-close:hover {
            background: var(--item-hover-bg);
            color: var(--primary);
        }
        .sidebar-items {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
            margin: 0 4px;
        }
        .sidebar-items::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-items::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            margin: 2px 0;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: all 0.25s ease;
            border-radius: 10px;
            border-left: none;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--bg-gradient);
            border-radius: 0 3px 3px 0;
            transition: height 0.25s ease;
        }
        .sidebar-item:hover {
            background: var(--item-hover-bg);
            color: var(--primary);
        }
        .sidebar-item:hover::before {
            height: 60%;
        }
        .sidebar-item.active {
            background: var(--item-active-bg);
            color: var(--primary);
            font-weight: 600;
        }
        .sidebar-item.active::before {
            height: 70%;
        }
        .sidebar-item .badge {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--bg-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(102,126,234,0.25);
        }
        .sidebar-item .badge svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .sidebar-item .item-label {
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .home-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            margin: 12px 16px 8px;
            background: var(--bg-gradient);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }
        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            opacity: 0.95;
        }
        .home-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .sidebar-tools {
            padding: 16px 16px 8px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar-tools button {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .sidebar-tools button:hover {
            background: var(--item-hover-bg);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(4px);
        }

        /* ===== 主内容区 ===== */
        .page-wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 80px 20px 20px;
            transition: padding 0.3s ease;
        }
        .main-content {
            min-width: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        header p {
            opacity: 0.9;
        }

        /* ===== 面包屑导航 ===== */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: var(--card-bg);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .breadcrumb-all {
            color: var(--primary);
            cursor: pointer;
            transition: color 0.2s;
        }
        .breadcrumb-all:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        .breadcrumb-sep {
            opacity: 0.5;
        }
        .breadcrumb-current {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* ===== 分类卡片 ===== */
        .category {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px var(--shadow);
            scroll-margin-top: 80px;
            transition: all 0.3s ease;
        }
        .category.hidden {
            display: none;
        }
        .category h2 {
            color: var(--text-primary);
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--bg-gradient);
            border-radius: 2px;
        }
        .site-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .site-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .site-card:hover {
            background: var(--card-hover);
            box-shadow: 0 4px 15px var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        .site-card.hidden {
            display: none;
        }
        .site-card .edit-hint {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-muted);
            z-index: 2;
            pointer-events: none;
        }
        .site-card:hover .edit-hint {
            display: flex;
        }
        .favicon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 2px 8px var(--shadow-md);
            position: relative;
            overflow: hidden;
        }
        .favicon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            background: white;
        }
        .site-info {
            flex: 1;
            min-width: 0;
        }
        .site-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .site-desc {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            margin-top: 2px;
        }
        .site-url {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            margin-top: 2px;
        }

        /* ===== 搜索结果高亮 ===== */
        .highlight {
            background: rgba(102,126,234,0.3);
            border-radius: 2px;
            padding: 0 2px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            fill: var(--text-muted);
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 16px;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px var(--shadow-lg);
            color: var(--text-primary);
        }
        .modal h3 {
            margin-bottom: 16px;
            font-size: 18px;
            color: var(--text-primary);
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .modal input[type="text"],
        .modal input[type="url"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            background: var(--card-bg);
            color: var(--text-primary);
        }
        .modal input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .modal .icon-preview {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin: 8px 0;
            overflow: hidden;
        }
        .modal .icon-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            color: var(--text-secondary);
        }
        .modal .upload-area:hover {
            border-color: var(--primary);
            background: var(--item-hover-bg);
        }
        .modal .upload-area input[type="file"] {
            display: none;
        }
        .modal .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .modal .btn-primary {
            background: var(--bg-gradient);
            color: white;
        }
        .modal .btn-primary:hover {
            opacity: 0.9;
        }
        .modal .btn-secondary {
            background: var(--border-color);
            color: var(--text-secondary);
        }
        .modal .btn-secondary:hover {
            background: var(--text-muted);
            color: white;
        }
        .modal .btn-danger {
            background: #ff4757;
            color: white;
        }
        .modal .btn-danger:hover {
            background: #ff3344;
        }

        /* ===== Theme colors ===== */
        .theme-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .theme-color {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        .theme-color:hover,
        .theme-color.active {
            border-color: var(--primary);
            transform: scale(1.1);
        }

        /* ===== Wallpaper presets ===== */
        .wallpaper-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        .wallpaper-preset {
            aspect-ratio: 16/9;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            background-size: cover;
            background-position: center;
        }
        .wallpaper-preset:hover,
        .wallpaper-preset.active {
            border-color: var(--primary);
        }

    <script>
        let defaultSites = [];
        let sites = [];
        let editingItem = null;
        let editingCatIdx = null;
        let editingItemIdx = null;
        let customIconData = null;

        const themes = [
            { name: '紫蓝', primary: '#667eea', secondary: '#764ba2' },
            { name: '青绿', primary: '#11998e', secondary: '#38ef7d' },
            { name: '橙红', primary: '#f12711', secondary: '#f5af19' },
            { name: '粉紫', primary: '#ec008c', secondary: '#fc6767' },
            { name: '深蓝', primary: '#2193b0', secondary: '#6dd5ed' },
            { name: '暗黑', primary: '#434343', secondary: '#000000' },
            { name: '日落', primary: '#ff512f', secondary: '#dd2476' },
            { name: '森林', primary: '#134e5e', secondary: '#71b280' },
        ];

        const wallpaperPresets = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
            'linear-gradient(135deg, #f12711 0%, #f5af19 100%)',
            'linear-gradient(135deg, #ec008c 0%, #fc6767 100%)',
            'linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%)',
            'linear-gradient(135deg, #434343 0%, #000000 100%)',
        ];

        // ===== 暗黑模式 =====
        function initDarkMode() {
            const saved = localStorage.getItem('siteAggregatorDarkMode');
            if (saved === 'true') {
                document.documentElement.setAttribute('data-theme', 'dark');
                updateThemeIcon(true);
            }

            document.getElementById('themeToggle').addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('siteAggregatorDarkMode', 'false');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('siteAggregatorDarkMode', 'true');
                }
                updateThemeIcon(!isDark);
            });
        }

        function updateThemeIcon(isDark) {
            document.getElementById('moonIcon').style.display = isDark ? 'none' : 'block';
            document.getElementById('sunIcon').style.display = isDark ? 'block' : 'none';
        }

        // ===== 回到顶部 =====
        function initBackToTop() {
            const btn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // ===== 搜索功能 =====
        function initSearch() {
            const input = document.getElementById('searchInput');
            const clear = document.getElementById('searchClear');
            const count = document.getElementById('searchCount');
            const empty = document.getElementById('emptyState');

            input.addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();
                clear.classList.toggle('show', query.length > 0);
                performSearch(query);
            });

            clear.addEventListener('click', () => {
                input.value = '';
                clear.classList.remove('show');
                count.classList.remove('show');
                performSearch('');
                input.focus();
            });
        }

        function performSearch(query) {
            const categories = document.querySelectorAll('.category');
            const cards = document.querySelectorAll('.site-card');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('searchCount');
            let totalMatches = 0;

            if (!query) {
                categories.forEach(cat => cat.classList.remove('hidden'));
                cards.forEach(card => {
                    card.classList.remove('hidden');
                    card.innerHTML = card.innerHTML.replace(/<mark class="highlight">(.*?)<\/mark>/g, '$1');
                });
                empty.style.display = 'none';
                count.classList.remove('show');
                return;
            }

            categories.forEach(cat => {
                const catCards = cat.querySelectorAll('.site-card');
                let catMatches = 0;
                catCards.forEach(card => {
                    const title = card.querySelector('.site-title').textContent;
                    const desc = card.querySelector('.site-desc, .site-url').textContent;
                    const namePinyin = card.dataset.namePinyin || '';
                    const descPinyin = card.dataset.descPinyin || '';
                    const catPinyin = card.dataset.catPinyin || '';
                    const catTitle = cat.querySelector('h2').textContent;

                    const matchText = title.toLowerCase().includes(query) || desc.toLowerCase().includes(query) || catTitle.toLowerCase().includes(query);
                    const matchPinyin = namePinyin.includes(query) || descPinyin.includes(query) || catPinyin.includes(query);
                    const match = matchText || matchPinyin;

                    if (match) {
                        card.classList.remove('hidden');
                        catMatches++;
                        totalMatches++;
                        // 高亮匹配文本（文本匹配优先，否则尝试拼音匹配高亮）
                        const titleEl = card.querySelector('.site-title');
                        if (title.toLowerCase().includes(query)) {
                            titleEl.innerHTML = highlightText(title, query);
                        } else if (namePinyin.includes(query)) {
                            // 拼音匹配时，高亮整个标题
                            titleEl.innerHTML = '<mark class="highlight">' + escapeHtml(title) + '</mark>';
                        } else {
                            titleEl.innerHTML = escapeHtml(title);
                        }
                    } else {
                        card.classList.add('hidden');
                    }
                });
                cat.classList.toggle('hidden', catMatches === 0);
            });

            if (totalMatches === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
            }

            count.textContent = `找到 ${totalMatches} 个结果`;
            count.classList.add('show');
        }

        function highlightText(text, query) {
            const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
            return text.replace(regex, '<mark class="highlight">$1</mark>');
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== 侧边栏 =====
        function initSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');
            function openSidebar() {
                sidebar.classList.add('show');
                overlay.classList.add('show');
                hamburger.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
                hamburger.classList.remove('active');
                document.body.style.overflow = '';
            }

            hamburger.addEventListener('click', () => {
                if (sidebar.classList.contains('show')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });

            overlay.addEventListener('click', closeSidebar);

            // 点击侧边栏项后关闭（移动端）
            document.getElementById('sidebarItems').addEventListener('click', (e) => {
                if (e.target.closest('.sidebar-item') && window.innerWidth <= 768) {
                    closeSidebar();
                }
            });

            const observer = new IntersectionObserver(function(entries) {
                const sidebarItems = document.querySelectorAll('.sidebar-item');
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        sidebarItems.forEach(el => {
                            el.classList.toggle('active', el.dataset.target === id);
                        });
                    }
                });
            }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });

            document.querySelectorAll('.category').forEach(el => observer.observe(el));
        }

        // ===== 其他原有功能 =====
        function loadSettings() {
            const saved = localStorage.getItem('siteAggregatorSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                if (settings.theme) applyTheme(settings.theme);
                if (settings.wallpaper) applyWallpaper(settings.wallpaper);
            }
        }

        function saveSettings() {
            const settings = {
                sites: sites,
                theme: {
                    primary: getComputedStyle(document.documentElement).getPropertyValue('--primary').trim(),
                    secondary: getComputedStyle(document.documentElement).getPropertyValue('--secondary').trim(),
                },
                wallpaper: document.body.classList.contains('custom-wallpaper') ? document.body.style.backgroundImage : null
            };
            localStorage.setItem('siteAggregatorSettings', JSON.stringify(settings));
        }

        function applyTheme(theme) {
            document.documentElement.style.setProperty('--primary', theme.primary);
            document.documentElement.style.setProperty('--secondary', theme.secondary);
            document.documentElement.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${theme.primary} 0%, ${theme.secondary} 100%)`);
        }

        function applyWallpaper(wallpaper) {
            if (!wallpaper || wallpaper === 'default') {
                document.body.classList.remove('custom-wallpaper');
                document.body.style.background = '';
                document.body.style.backgroundImage = '';
            } else if (wallpaper.startsWith('linear-gradient')) {
                document.body.classList.remove('custom-wallpaper');
                document.body.style.background = wallpaper;
            } else {
                document.body.classList.add('custom-wallpaper');
                document.body.style.backgroundImage = wallpaper;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
            }
        }

        let currentCategoryIndex = -1; // -1 表示显示全部

        function renderCategory(ci) {
            const app = document.getElementById('app');
            const cat = sites[ci];
            const id = cat.category.replace(/\s+/g, '_');
            let html = `<section class="category active-category" id="cat_${id}"><h2>${cat.category}</h2><div class="site-grid">`;
            for (let ii = 0; ii < cat.items.length; ii++) {
                const item = cat.items[ii];
                const namePinyin = window.pinyinPro ? pinyinPro.pinyin(item.name, { toneType: 'none', type: 'array' }).join('') : '';
                const descPinyin = item.desc && window.pinyinPro ? pinyinPro.pinyin(item.desc, { toneType: 'none', type: 'array' }).join('') : '';
                const catPinyin = window.pinyinPro ? pinyinPro.pinyin(cat.category, { toneType: 'none', type: 'array' }).join('') : '';
                html += `<a href="${item.url}" class="site-card" target="_blank" rel="noopener" data-ci="${ci}" data-ii="${ii}" data-name-pinyin="${namePinyin}" data-desc-pinyin="${descPinyin}" data-cat-pinyin="${catPinyin}">`;
                html += `<span class="edit-hint" title="右键编辑">✎</span>`;
                const iconData = item.customIcon ? `data-custom="1"` : '';
                html += `<div class="favicon" data-domain="${item.domain}" data-icon="${item.icon}" data-name="${item.name}" ${iconData}>${item.customIcon ? '' : item.icon}</div>`;
                html += `<div class="site-info"><span class="site-title">${item.name}</span>`;
                if (item.desc) {
                    html += `<span class="site-desc">${item.desc}</span>`;
                } else {
                    html += `<span class="site-url">${item.domain}</span>`;
                }
                html += `</div></a>`;
            }
            html += `</div></section>`;
            app.innerHTML = html;
            loadFavicons();
            bindCardEvents();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateBreadcrumb();
        }

        function showAllCategories() {
            currentCategoryIndex = -1;
            render();
            // 更新侧边栏激活状态
            const container = document.getElementById('sidebarItems');
            container.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            container.querySelector('.sidebar-item[data-cat-index="-1"]').classList.add('active');
        }

        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            const current = document.getElementById('breadcrumbCurrent');
            if (currentCategoryIndex >= 0) {
                breadcrumb.style.display = 'flex';
                current.textContent = sites[currentCategoryIndex].category;
            } else {
                breadcrumb.style.display = 'none';
            }
        }

        function render() {
            if (currentCategoryIndex >= 0) {
                renderCategory(currentCategoryIndex);
                return;
            }
            updateBreadcrumb();
            const app = document.getElementById('app');
            let html = '';
            for (let ci = 0; ci < sites.length; ci++) {
                const cat = sites[ci];
                const id = cat.category.replace(/\s+/g, '_');
                html += `<section class="category" id="cat_${id}"><h2>${cat.category}</h2><div class="site-grid">`;
                for (let ii = 0; ii < cat.items.length; ii++) {
                    const item = cat.items[ii];
                    const namePinyin = window.pinyinPro ? pinyinPro.pinyin(item.name, { toneType: 'none', type: 'array' }).join('') : '';
                    const descPinyin = item.desc && window.pinyinPro ? pinyinPro.pinyin(item.desc, { toneType: 'none', type: 'array' }).join('') : '';
                    const catPinyin = window.pinyinPro ? pinyinPro.pinyin(cat.category, { toneType: 'none', type: 'array' }).join('') : '';
                    html += `<a href="${item.url}" class="site-card" target="_blank" rel="noopener" data-ci="${ci}" data-ii="${ii}" data-name-pinyin="${namePinyin}" data-desc-pinyin="${descPinyin}" data-cat-pinyin="${catPinyin}">`;
                    html += `<span class="edit-hint" title="右键编辑">✎</span>`;
                    const iconData = item.customIcon ? `data-custom="1"` : '';
                    html += `<div class="favicon" data-domain="${item.domain}" data-icon="${item.icon}" data-name="${item.name}" ${iconData}>${item.customIcon ? '' : item.icon}</div>`;
                    html += `<div class="site-info"><span class="site-title">${item.name}</span>`;
                    if (item.desc) {
                        html += `<span class="site-desc">${item.desc}</span>`;
                    } else {
                        html += `<span class="site-url">${item.domain}</span>`;
                    }
                    html += `</div></a>`;
                }
                html += `</div></section>`;
            }
            app.innerHTML = html;

            loadFavicons();
            bindCardEvents();
        }

        function loadFavicons() {
            document.querySelectorAll('.favicon[data-domain]').forEach(el => {
                const domain = el.dataset.domain;
                const icon = el.dataset.icon;
                const name = el.dataset.name;
                if (el.dataset.custom) {
                    const item = findItemByName(name);
                    if (item && item.customIcon) {
                        el.innerHTML = `<img src="${item.customIcon}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;background:white;display:block;">`;
                    }
                    return;
                }
                let tried = 0;

                function tryLoad() {
                    if (tried >= 3) {
                        el.textContent = icon;
                        el.style.fontSize = '22px';
                        return;
                    }
                    const sources = [
                        { url: `https://icons.duckduckgo.com/ip3/${domain}.ico`, label: 'ddg' },
                        { url: `https://www.google.com/s2/favicons?sz=128&domain=${domain}&t=${Date.now()}`, label: 'google' },
                        { url: `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://${domain}&size=128`, label: 'gstatic' },
                    ];
                    const src = sources[tried];
                    tried++;

                    const img = new Image();
                    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;background:white;display:block;';

                    let timeout = setTimeout(function() {
                        img.src = '';
                        tryLoad();
                    }, 3000);

                    img.onload = function() {
                        clearTimeout(timeout);
                        if (img.naturalWidth >= 32 && img.naturalHeight >= 32) {
                            el.innerHTML = '';
                            el.appendChild(img);
                        } else if (tried < 3) {
                            tryLoad();
                        } else {
                            el.textContent = icon;
                            el.style.fontSize = '22px';
                        }
                    };
                    img.onerror = function() {
                        clearTimeout(timeout);
                        tryLoad();
                    };
                    img.src = src.url;
                }
                tryLoad();
            });
        }

        function bindCardEvents() {
            document.querySelectorAll('.site-card').forEach(card => {
                card.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    openEditModal(parseInt(this.dataset.ci), parseInt(this.dataset.ii));
                });
            });
        }

                '音乐资源': '<svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>',
                '网盘资源': '<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>',
                '教育健康': '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',

            for (let ci = 0; ci < sites.length; ci++) {

            container.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', function() {
                    container.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));

                    const catIndex = parseInt(this.dataset.catIndex);
                    currentCategoryIndex = catIndex;
                    render();

        function findItemByName(name) {
            for (const cat of sites) {
                for (const item of cat.items) {
                    if (item.name === name) return item;
                }
            }
            return null;
        }

        function openEditModal(ci, ii) {
            editingCatIdx = ci;
            editingItemIdx = ii;
            editingItem = sites[ci].items[ii];
            customIconData = editingItem.customIcon || null;

            document.getElementById('editName').value = editingItem.name;
            document.getElementById('editUrl').value = editingItem.url;
            document.getElementById('editIcon').value = editingItem.icon;
            updateIconPreview();

            document.getElementById('editModal').classList.add('active');
        }

        function updateIconPreview() {
            const preview = document.getElementById('editIconPreview');
            if (customIconData) {
                preview.innerHTML = `<img src="${customIconData}">`;
            } else {
                preview.textContent = document.getElementById('editIcon').value || '?';
                preview.innerHTML = '';
                preview.textContent = document.getElementById('editIcon').value || '?';
            }
        }

        function initModals() {
            document.getElementById('editCancel').addEventListener('click', () => {
                document.getElementById('editModal').classList.remove('active');
                customIconData = null;
            });

            document.getElementById('editSave').addEventListener('click', () => {
                if (editingItem) {
                    editingItem.name = document.getElementById('editName').value;
                    editingItem.url = document.getElementById('editUrl').value;
                    editingItem.icon = document.getElementById('editIcon').value;
                    if (customIconData) {
                        editingItem.customIcon = customIconData;
                    } else {
                        delete editingItem.customIcon;
                    }
                    saveSettings();
                    render();
                }
                document.getElementById('editModal').classList.remove('active');
                customIconData = null;
            });

            document.getElementById('editDelete').addEventListener('click', () => {
                if (editingCatIdx !== null && editingItemIdx !== null) {
                    sites[editingCatIdx].items.splice(editingItemIdx, 1);
                    saveSettings();
                    render();
                }
                document.getElementById('editModal').classList.remove('active');
            });

            document.getElementById('editIcon').addEventListener('input', updateIconPreview);

            document.getElementById('iconUploadArea').addEventListener('click', () => {
                document.getElementById('editIconFile').click();
            });

            document.getElementById('editIconFile').addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        customIconData = e.target.result;
                        updateIconPreview();
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('btnTheme').addEventListener('click', () => {
                document.getElementById('themeModal').classList.add('active');
            });

            document.getElementById('themeCancel').addEventListener('click', () => {
                document.getElementById('themeModal').classList.remove('active');
            });

            const themeContainer = document.getElementById('themeColors');
            themes.forEach((theme, idx) => {
                const div = document.createElement('div');
                div.className = 'theme-color';
                div.style.background = `linear-gradient(135deg, ${theme.primary}, ${theme.secondary})`;
                div.title = theme.name;
                div.addEventListener('click', () => {
                    applyTheme(theme);
                    saveSettings();
                    document.querySelectorAll('.theme-color').forEach((el, i) => {
                        el.classList.toggle('active', i === idx);
                    });
                });
                themeContainer.appendChild(div);
            });

            document.getElementById('btnWallpaper').addEventListener('click', () => {
                document.getElementById('wallpaperModal').classList.add('active');
            });

            document.getElementById('wallpaperCancel').addEventListener('click', () => {
                document.getElementById('wallpaperModal').classList.remove('active');
            });

            document.getElementById('wallpaperReset').addEventListener('click', () => {
                applyWallpaper('default');
                saveSettings();
                document.getElementById('wallpaperModal').classList.remove('active');
            });

            const wpContainer = document.getElementById('wallpaperPresets');
            wallpaperPresets.forEach((wp, idx) => {
                const div = document.createElement('div');
                div.className = 'wallpaper-preset';
                div.style.background = wp;
                div.addEventListener('click', () => {
                    applyWallpaper(wp);
                    saveSettings();
                });
                wpContainer.appendChild(div);
            });

            document.getElementById('wallpaperUploadArea').addEventListener('click', () => {
                document.getElementById('wallpaperFile').click();
            });

            document.getElementById('wallpaperFile').addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        applyWallpaper(`url(${e.target.result})`);
                        saveSettings();
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.classList.remove('active');
                    }
                });
            });
        }

        // ===== 加载 sites.json =====
        async function loadSites() {
            try {
                const response = await fetch('assets/data/sites.json');
                if (!response.ok) throw new Error('加载 sites.json 失败');
                defaultSites = await response.json();
                sites = JSON.parse(JSON.stringify(defaultSites));
            } catch (err) {
                console.error('加载 sites.json 失败:', err);
                defaultSites = [];
                sites = [];
            }
        }

        // ===== 初始化 =====
        async function init() {
            await loadSites();
            loadSettings();
            initDarkMode();
            initBackToTop();
            initSearch();
            initSidebar();
            initModals();

            // 等待 pinyin-pro 库加载完成后再渲染
            function waitForPinyinPro(callback, maxRetries) {
                maxRetries = maxRetries || 50;
                let retries = 0;
                function check() {
                    if (window.pinyinPro) {
                        callback();
                    } else if (retries < maxRetries) {
                        retries++;
                        setTimeout(check, 100);
                    } else {
                        // 超时，仍然渲染（无拼音支持）
                        callback();
                    }
                }
                check();
            }

            waitForPinyinPro(function() {
                render();
                renderSidebar();
            });
        }

        init();
    </script>
</body>
